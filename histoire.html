<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Caroline — Histoire</title>
<meta name="theme-color" content="#2f4a3c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>:root {
  --ink: #1c2420;
  --muted: #5a6560;
  --paper: #f4f2ee;
  --panel: #ffffff;
  --line: #d4d8d3;
  --accent: #2f4a3c;
  --accent-soft: rgba(47, 74, 60, 0.12);
  --link: #1a4f6e;
  --f: #1f6b45;
  --s: #9a6b12;
  --h: #2a5a8a;
  --av: #6b6f6c;
  --measure: 46rem;
  --rail: 12.5rem;
  --flash: #d8e8c8;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 3.5rem; }
body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, #e7ebe4 0%, transparent 55%),
    var(--paper);
  font-family: "Source Serif 4", "Libre Baskerville", Georgia, "Times New Roman", serif;
  font-size: 1.125rem;
  line-height: 1.68;
}
a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.18em;
  transition: color .15s ease, background-color .15s ease;
}
a:hover { color: var(--accent); }

/* Site nav (Monographie | Archives) */
.site-nav {
  position: sticky;
  top: 0;
  z-index: 80;
  background: rgba(244, 242, 238, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.site-nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: min(100% - 1.5rem, 90rem);
  margin: 0 auto;
  padding: .65rem 0;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
}
.site-brand {
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--accent);
  text-decoration: none;
}
.site-tabs { display: flex; gap: .25rem; }
.site-tabs a {
  color: var(--muted);
  text-decoration: none;
  font-size: .88rem;
  font-weight: 600;
  padding: .45rem .75rem;
  border: 1px solid transparent;
}
.site-tabs a:hover { color: var(--ink); }
.site-tabs a.is-active {
  color: var(--accent);
  border-color: var(--line);
  background: var(--panel);
}

/* Progress */
.progress {
  position: fixed;
  inset: 0 0 auto 0;
  height: 3px;
  z-index: 100;
  background: transparent;
  pointer-events: none;
}
.progress > span {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #6a8f72);
  transition: width .05s linear;
}

/* Hero */
.hero {
  position: relative;
  width: 100%;
  min-height: min(68vh, 560px);
  background: #2a3330 center/cover no-repeat;
  display: flex;
  align-items: flex-end;
  isolation: isolate;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(12,18,16,.82) 0%, rgba(12,18,16,.28) 48%, rgba(12,18,16,.18) 100%);
}
.hero-inner {
  position: relative;
  z-index: 1;
  width: min(100% - 2rem, 74rem);
  margin: 0 auto;
  padding: 3rem 0 2.4rem;
  color: #f4f2ee;
}
.hero h1 {
  margin: 0 0 .4rem;
  font-size: clamp(2.3rem, 5.2vw, 3.55rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.12;
  animation: rise .7s ease both;
}
.hero .subtitle {
  margin: 0 0 1.25rem;
  max-width: 36rem;
  font-size: 1.05rem;
  opacity: .92;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  animation: rise .7s .08s ease both;
}
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .92rem;
  font-weight: 600;
  color: #f4f2ee;
  text-decoration: none;
  border: 1px solid rgba(244,242,238,.45);
  padding: .55rem 1rem;
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
  animation: rise .7s .16s ease both;
}
.hero-cta:hover {
  background: rgba(244,242,238,.12);
  border-color: rgba(244,242,238,.85);
  color: #fff;
  transform: translateY(-1px);
}
.hero-cta::after { content: "↓"; opacity: .8; }
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* Layout */
.layout {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr) var(--rail);
  column-gap: clamp(1.75rem, 3.5vw, 3.25rem);
  row-gap: 1.5rem;
  width: min(100% - 2.5rem, 90rem);
  margin: 0 auto;
  padding: 2rem 0 5rem;
  align-items: start;
}
.toc, .explore {
  position: sticky;
  top: 1.4rem;
  align-self: start;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .8rem;
  line-height: 1.35;
  max-height: calc(100vh - 2rem);
  overflow: auto;
}
.rail-label {
  display: block;
  margin: 0 0 .55rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .07em;
  font-size: .7rem;
  font-weight: 700;
}
.toc a {
  display: block;
  color: var(--muted);
  text-decoration: none;
  padding: .32rem 0 .32rem .7rem;
  border-left: 2px solid transparent;
  margin-left: -.7rem;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.toc a:hover { color: var(--ink); border-left-color: #a7b7ab; }
.toc a.is-active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: var(--accent-soft);
}

/* Explore rail */
.explore-block { margin-bottom: 1.35rem; }
.chip-row { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font: inherit;
  font-size: .74rem;
  font-weight: 600;
  padding: .28rem .55rem;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
}
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.chip.is-on {
  background: var(--accent);
  border-color: var(--accent);
  color: #f7f6f3;
}
.chip.tag-f.is-on, .chip[data-filter="f"].is-on { background: var(--f); border-color: var(--f); }
.chip.tag-s.is-on, .chip[data-filter="s"].is-on { background: var(--s); border-color: var(--s); }
.chip.tag-h.is-on, .chip[data-filter="h"].is-on { background: var(--h); border-color: var(--h); }
.chip.tag-av.is-on, .chip[data-filter="av"].is-on { background: var(--av); border-color: var(--av); }
.explore-hint {
  margin: .55rem 0 0;
  color: var(--muted);
  font-size: .72rem;
  line-height: 1.35;
}
.quick-links { display: grid; gap: .25rem; }
.quick-links a {
  color: var(--muted);
  text-decoration: none;
  padding: .2rem 0;
}
.quick-links a:hover { color: var(--link); }

/* Article */
.article {
  min-width: 0;
  max-width: var(--measure);
  width: 100%;
  justify-self: center;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
  -webkit-hyphens: auto;
}
.article > *:first-child { margin-top: 0; }
.article h2, .article h3, .article .tag-legend, .article table,
.article .tag-legend p, .article figcaption, .article p > em:only-child,
.article .figure-wrap, .article .compare, .article .source-line { text-align: left; }
h2 {
  margin: 2.5rem 0 .95rem;
  font-size: 1.55rem;
  line-height: 1.25;
  color: var(--accent);
  font-weight: 600;
  scroll-margin-top: 3.5rem;
}
h3 {
  margin: 1.7rem 0 .55rem;
  font-size: 1.15rem;
  font-weight: 600;
  scroll-margin-top: 3.5rem;
}
h2.is-flash, h3.is-flash, .xref-hit.is-flash {
  animation: flash 1.2s ease;
}
@keyframes flash {
  0%, 100% { background: transparent; }
  25% { background: var(--flash); }
}
p { margin: 0 0 1rem; }
blockquote {
  margin: 1rem 0;
  padding: .25rem 0 .25rem 1rem;
  border-left: 3px solid var(--line);
  color: var(--muted);
  font-style: italic;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .95rem;
  margin: 1rem 0 1.4rem;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
}
th, td {
  border-bottom: 1px solid var(--line);
  padding: .45rem .4rem;
  text-align: left;
  vertical-align: top;
}
tr:hover td { background: rgba(47,74,60,.04); }

/* Figures + lightbox */
.figure-wrap {
  margin: 1.15rem 0 .2rem;
  position: relative;
}
.figure-wrap img,
.article > p > img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0;
  cursor: zoom-in;
  transition: transform .25s ease, box-shadow .25s ease;
}
.figure-wrap:hover img,
.article > p > img:hover {
  transform: scale(1.01);
  box-shadow: 0 10px 28px rgba(28,36,32,.12);
}
.figure-wrap .zoom-hint {
  position: absolute;
  right: .55rem;
  bottom: .55rem;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .68rem;
  font-weight: 600;
  color: #f4f2ee;
  background: rgba(12,18,16,.55);
  padding: .2rem .4rem;
  opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
}
.figure-wrap:hover .zoom-hint { opacity: 1; }
.article p:has(> img) { margin-bottom: .2rem; }
/* Captions only: a paragraph that is entirely <em>…</em> (figure legends).
   Inline emphasis like *cette* must stay in the body flow. */
.article p > em:only-child {
  display: block;
  font-size: .9rem;
  color: var(--muted);
  margin: 0 0 1.25rem;
  line-height: 1.45;
}

/* Compare slider */
.compare {
  position: relative;
  margin: 1.2rem 0 1.5rem;
  overflow: hidden;
  background: #1c2420;
  user-select: none;
  touch-action: none;
  aspect-ratio: 16 / 10;
}
.compare img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  margin: 0;
  max-width: none;
  pointer-events: none;
  cursor: default;
  transform: none !important;
  box-shadow: none !important;
}
.compare .compare-top {
  clip-path: inset(0 50% 0 0);
}
.compare-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  background: #f4f2ee;
  transform: translateX(-50%);
  z-index: 2;
}
.compare-handle::before {
  content: "⟷";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 2rem;
  height: 2rem;
  border-radius: 999px;
  background: #f4f2ee;
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: .85rem;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.compare-label {
  position: absolute;
  top: .6rem;
  z-index: 2;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #f4f2ee;
  background: rgba(12,18,16,.5);
  padding: .2rem .45rem;
}
.compare-label.before { left: .6rem; }
.compare-label.after { right: .6rem; }
.compare-caption {
  margin: .35rem 0 1.4rem;
  font-size: .9rem;
  color: var(--muted);
  font-style: italic;
  font-family: "Source Serif 4", Georgia, serif;
}

/* Tags */
.tag {
  display: inline-block;
  position: relative;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .72rem;
  font-weight: 700;
  font-style: normal;
  letter-spacing: .02em;
  padding: .08em .38em;
  border: 1px solid currentColor;
  border-radius: 2px;
  vertical-align: .12em;
  line-height: 1.2;
  white-space: nowrap;
  cursor: help;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.tag:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 0 currentColor;
  background: rgba(255,255,255,.65);
}
.tag-f { color: var(--f); }
.tag-s { color: var(--s); }
.tag-h { color: var(--h); }
.tag-av { color: var(--av); }
.tag[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + .35rem);
  transform: translateX(-50%) translateY(4px);
  min-width: 11rem;
  max-width: 16rem;
  padding: .4rem .5rem;
  background: #1c2420;
  color: #f4f2ee;
  font-size: .68rem;
  font-weight: 500;
  line-height: 1.35;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease, transform .15s ease;
  z-index: 20;
}
.tag[data-tip]:hover::after,
.tag[data-tip]:focus-visible::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
body.is-filtering .article > *.is-proof-dim,
body.is-filtering .toc a.is-proof-dim {
  opacity: 0.28;
  transition: opacity 0.2s ease;
}
body.is-filtering .article > *:not(.is-proof-dim),
body.is-filtering .toc a:not(.is-proof-dim) {
  opacity: 1;
  transition: opacity 0.2s ease;
}
body.is-filtering .tag:not(.is-proof-match) {
  opacity: 0.35;
}
body.is-filtering .tag.is-proof-match {
  opacity: 1;
}
.tag-legend {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 1rem 1.1rem;
  margin: 1.5rem 0 2rem;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .92rem;
}
.tag-legend table { margin-bottom: 0; }

/* Source lines + xrefs */
.source-line {
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .92rem;
  padding: .35rem .55rem;
  margin: -.35rem 0 1rem;
  border-left: 2px solid transparent;
  transition: background .15s ease, border-color .15s ease;
}
.source-line:hover {
  background: rgba(26,79,110,.06);
  border-left-color: var(--link);
}
.source-line a { word-break: break-word; }
.xref {
  appearance: none;
  border: 0;
  background: linear-gradient(transparent 60%, rgba(47,74,60,.18) 60%);
  color: inherit;
  font: inherit;
  padding: 0 .05em;
  cursor: pointer;
  border-radius: 1px;
  transition: background .15s ease;
}
.xref:hover {
  background: linear-gradient(transparent 55%, rgba(47,74,60,.32) 55%);
  color: var(--accent);
}
body.xref-salis .xref[data-xref="salis"],
body.xref-deglane .xref[data-xref="deglane"],
body.xref-marie-louise .xref[data-xref="marie-louise"],
body.xref-audy .xref[data-xref="audy"],
body.xref-naintre .xref[data-xref="naintre"],
body.xref-parcelle .xref[data-xref="parcelle"] {
  background: var(--flash);
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: rgba(12,18,16,.88);
  backdrop-filter: blur(4px);
}
.lightbox.is-open { display: flex; }
.lightbox img {
  max-width: min(1100px, 94vw);
  max-height: 86vh;
  object-fit: contain;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  animation: rise .25s ease;
}
.lightbox-cap {
  position: absolute;
  left: 50%;
  bottom: 1.1rem;
  transform: translateX(-50%);
  max-width: min(48rem, 90vw);
  color: #e8ebe6;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .85rem;
  text-align: center;
  opacity: .9;
}
.lightbox-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  appearance: none;
  border: 1px solid rgba(244,242,238,.35);
  background: transparent;
  color: #f4f2ee;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .85rem;
  padding: .4rem .7rem;
  cursor: pointer;
}
.lightbox-close:hover { background: rgba(244,242,238,.12); }

.back-top {
  position: fixed;
  right: 1.1rem;
  bottom: 1.1rem;
  z-index: 50;
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-size: .78rem;
  font-weight: 600;
  padding: .55rem .7rem;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.back-top.is-visible {
  opacity: 1;
  pointer-events: auto;
}
.back-top:hover { transform: translateY(-2px); border-color: var(--accent); }

.mobile-explore { display: none; }

@media (max-width: 1200px) {
  .layout {
    grid-template-columns: 11.5rem minmax(0, 1fr);
    width: min(100% - 2rem, 78rem);
  }
  .explore { display: none; }
  .mobile-explore {
    display: block;
    margin: 0 0 1.35rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }
  .mobile-explore .rail-label { margin-top: .75rem; }
  .mobile-explore .rail-label:first-child { margin-top: 0; }
  .mobile-explore .chip-row { margin-top: .35rem; }
}

@media (max-width: 900px) {
  html { scroll-padding-top: 1rem; }
  body {
    font-size: 1.05rem;
    line-height: 1.62;
  }
  .hero {
    min-height: min(52vh, 380px);
    background-position: center 30%;
  }
  .hero-inner {
    width: min(100% - 1.25rem, 46rem);
    padding: 1.75rem 0 1.5rem;
  }
  .hero h1 { font-size: clamp(1.85rem, 8vw, 2.4rem); }
  .hero .subtitle { font-size: .95rem; margin-bottom: 1rem; }
  .layout {
    grid-template-columns: 1fr;
    gap: 1rem;
    width: min(100% - 1.25rem, 46rem);
    padding: 1.25rem 0 4.5rem;
  }
  .article {
    justify-self: stretch;
    max-width: none;
    text-align: left; /* avoid justify rivers on narrow screens */
  }
  .toc {
    position: static;
    max-height: none;
    overflow: visible;
    width: 100%;
  }
  .toc-box {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: .15rem .7rem .55rem;
  }
  .toc-box > summary {
    list-style: none;
    cursor: pointer;
    font-family: "Source Sans 3", "Segoe UI", sans-serif;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: .55rem 0;
  }
  .toc-box > summary::-webkit-details-marker { display: none; }
  .toc-box > summary::after {
    content: " +";
    float: right;
    font-weight: 700;
  }
  .toc-box[open] > summary::after { content: " −"; }
  .toc-box .rail-label { display: none; }
  .toc-box .toc-links {
    display: grid;
    gap: .1rem;
    padding-bottom: .35rem;
  }
  .toc a {
    border: 0;
    margin: 0;
    padding: .45rem 0;
    font-size: .88rem;
    line-height: 1.3;
  }
  .toc a.is-active {
    background: transparent;
    color: var(--accent);
    font-weight: 700;
  }
  .chip {
    min-height: 2.5rem;
    padding: .4rem .7rem;
    font-size: .8rem;
  }
  .tag[data-tip]::after { display: none; } /* tooltips flaky on touch */
  table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-size: .88rem;
  }
  .compare { aspect-ratio: 4 / 3; min-height: 12rem; }
  .compare-handle::before {
    width: 2.6rem;
    height: 2.6rem;
  }
  .lightbox {
    padding: .75rem;
    padding-top: max(.75rem, env(safe-area-inset-top));
  }
  .lightbox img {
    max-width: 100%;
    max-height: 78vh;
  }
  .lightbox-close {
    top: max(.65rem, env(safe-area-inset-top));
    right: .65rem;
    min-height: 2.6rem;
    min-width: 4.2rem;
    padding: .55rem .8rem;
  }
  .lightbox-cap {
    bottom: max(.75rem, env(safe-area-inset-bottom));
    font-size: .78rem;
  }
  .back-top {
    right: max(.75rem, env(safe-area-inset-right));
    bottom: max(.75rem, env(safe-area-inset-bottom));
    min-height: 2.6rem;
    min-width: 2.6rem;
  }

<script type="application/json" id="hist-seed">{"id": "20261118-ship-remediation", "createdAt": "2026-11-18T10:24:00+01:00", "label": "Remediation livraison", "parentId": null, "source": "ship-gate", "stats": {"delete": 70, "insert": 121}, "hunks": [{"op": "del", "text": "*(autrefois Villa Marie-Louise)*"}, {"op": "ins", "text": "*Nom « Villa Marie-Louise » attesté sur cette rue vers 1903 **[F]** ; identité avec le n°13 / AB 143 encore **[H]**.*"}, {"op": "del", "text": "## En quelques mots"}, {"op": "del", "text": ""}, {"op": "del", "text": "Face au château des Ormes, sur une lanière de jardin entre la rue et le parc, se dresse une maison de villégiature que l’on appelle aujourd’hui Villa Caroline. Elle occupe la parcelle AB 143 - trois cent soixante-six mètres carrés - au 13 de la rue Pierre-d’Argenson. Au début du XXᵉ siècle, la même maison s’appelait déjà Villa Marie-Louise : une carte postale de la rue le montre clairement. Le volume principal est là sur les vues aériennes des années 1950 ; la piscine, elle, n’apparaît qu’au début des années 2000. La maison n’est pas classée monument historique, mais elle se trouve dans le rayon de protection des abords du château : tout travaux sensibles y demandent un avis préalable."}, {"op": "del", "text": ""}, {"op": "del", "text": "Autour de cette adresse circule un récit agréable et tenace. Henri Deglane, Prix de Rome et futur architecte du Grand Palais, aurait bâti la villa en 1890. Rodolphe Salis, le fondateur du Chat Noir à Paris, Châtelleraudais d’origine, l’aurait commandée pour une Marie-Louise. Plus tard, la famille Audy l’aurait acquise vers le milieu du XXᵉ siècle et rebaptisée Caroline, en hommage à Caroline Waldé, mère de l’actuel habitant. Office de tourisme, presse et blogs locaux reprennent en pratique le même courant : un récit unique, répété, plus qu’une chaîne de preuves indépendantes."}, {"op": "del", "text": ""}, {"op": "del", "text": "Ce que l’on peut tenir pour solide se sépare assez nettement de ce récit. Deglane a bien, dans sa notice de référence, « une villa aux Ormes (Vienne) en 1890 » - le catalogue d’architecte est clair. Que ce soit précisément le numéro 13 de la rue Pierre-d’Argenson reste vraisemblable (la carte postale Marie-Louise sur *cette* rue va dans le même sens), mais aucun plan, permis ni matrice cadastrale ne l’a encore scellé. Salis, lui, est bien documenté dans la région : en novembre 1890, chez le notaire Lasserré à Châtellerault, il achète une pièce de terre en vigne au lieu-dit « les Ormes » - mais dans la *commune de Naintré*, pas aux Ormes, et pour une surface d’environ un hectare et demi, sans rapport avec les 366 m² de la villa. Deux ans plus tard, il acquiert la Tour de Naintré ; il y meurt en 1897. Aucun acte consulté jusqu’ici ne le montre propriétaire de la maison de la rue Pierre-d’Argenson. Dans l’état civil de la commune des Ormes, entre 1883 et 1902, le nom Salis n’apparaît ni aux naissances, ni aux mariages, ni aux décès ; le recensement du bourg en 1891 non plus. Sous la lettre S des naissances figure un Salsier Louis, en 1891 - orthographe distincte, autre personne. Le patronyme Boulanger parfois collé à Marie-Louise sur Internet repose sur une modification Wikipédia anonyme, sans source."}, {"op": "del", "text": ""}, {"op": "del", "text": "Les Audy, en revanche, laissent une trace locale ancienne : le 16 avril 1898, Ludger Eugène Audy épouse Camille Angèle Coutard aux Ormes. Fabrice Audy habite bien le 13 rue Pierre-d’Argenson aujourd’hui. Entre ces deux pôles - présence Audy dès 1898, domicile contemporain - la date d’acquisition de *cette* maison et la chaîne de titres restent ouvertes. Quant au style, toitures débordantes, bois apparent, baies hautes et jeux de brique disent plutôt Belle Époque / fin XIXᵉ que l’« art déco » inscrit dans le PLU - une étiquette de document, pas une datation d’architecte."}, {"op": "del", "text": ""}, {"op": "del", "text": "En résumé : la maison est bien là, nommée, photographiée, située : "ins", "text": ""}, {"op": "ins", "text": "Tables décennales Ormes **1883–1902** : **aucun Salis** indexé (N/M/D) **[F]** ; naissance **Salsier** Louis, 1891 (**≠** Salis) **[F]**. Sur le recensement 1891 (*vues consultées* : Place de la Halle, Grande Rue) : **Salis non repéré** **[F]** (négatif limité aux vues lues)."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "→ [TD Ormes 1883–1892](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [TD 1893–1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c)  "}, {"op": "ins", "text": "→ [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d)"}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Mariage **Audy Ludger × Coutard**, 16 avril 1898, aux Ormes **[F]**. Annuaire agrégateur contemporain : **Fabrice Audy** au n°13 **[F]** — adresse d’annuaire, **pas** un titre de propriété."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "→ [TD mariages 1893–1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c)  "}, {"op": "ins", "text": "→ [Annuaire agrégateur — Audy Fabrice](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)"}, {"op": "ins", "text": ""}, {"op": "ins", "text": "La cote AN **AJ/52/361** citée par AGORHA est un **dossier d’élève** (lettres, notes), **pas** un fonds de plans de la villa **[F]**."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "→ [AGORHA — notice Deglane](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf)"}, {"op": "ins", "text": ""}, {"op": "ins", "text": "### B — Tradition et questions ouvertes"}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Que la carte postale « Marie-Louise » montre *exactement* le bâtiment du n°13 / AB 143 reste **[H]** tant que calage façade / matrice manquent."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Identification Deglane = n°13 / AB 143 : **[H]/[ÀV]**."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Tradition locale (office Argenson n’est pas établi : la [carte postale Marie-Louise](https://en.geneanet.org/postcards/view/7781445) sur cette rue renforce l’hypothèse, sans plan, permis ni matrice pour la sceller **[H]/[ÀV]**."}, {"op": "ins", "text": "Deglane a donc une villa aux Ormes, en 1890, dans son catalogue **[F]**. Que ce soit le numéro 13 de la rue Pierre-d’Argenson n’est pas établi : la [carte postale Marie-Louise](https://en.geneanet.org/postcards/view/7781445) sur cette rue nourrit l’hypothèse, sans plan, permis ni matrice pour la sceller **[H]/[ÀV]**."}, {"op": "del", "text": "Châtelleraudais, fondateur du Chat Noir à Paris, époux de Marie Gabrielle Thiennet, acquéreur de la Tour de Naintré en 1892 **[F]**, mort à Naintré en 1897 **[F]**."}, {"op": "ins", "text": "Fondateur du Chat Noir à Paris, époux de Marie Gabrielle Thiennet, acquéreur de la Tour de Naintré en 1892 **[F]**, mort à Naintré en 1897 **[F]**. Origine « châtelleraudaise » parfois rapportée : **[S]** (acte de naissance non cité ici)."}, {"op": "del", "text": "Dans l’état civil *de la commune des Ormes* pour 1883-1892, le nom **Salis** n’apparaît ni aux naissances, ni aux mariages, ni aux décès **[F]**."}, {"op": "ins", "text": "Dans les *tables décennales* des Ormes pour 1883-1892, le nom **Salis** n’est indexé ni aux naissances, ni aux mariages, ni aux décès **[F]**."}, {"op": "del", "text": "Sur le recensement de 1891 du bourg (Place de la Halle, Grande Rue), **aucun Salis** **[F]** - [recensement 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). À la Place de la Halle : **René d’Argenson**, propriétaire, avec deux enfants et du personnel **[F]** :"}, {"op": "ins", "text": "Sur le recensement de 1891, *vues consultées* (Place de la Halle, Grande Rue) : **Salis non repéré** **[F]** — [recensement 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). À la Place de la Halle : **René d’Argenson**, propriétaire, avec deux enfants et du personnel **[F]** :"}, {"op": "del", "text": "*Liste nominative 1891, « La Halle » **[F]**. Source : [AD86, recensement Les Ormes 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). Prouve la présence d’Argenson au bourg en 1891. Ne dit rien de Salis ni de la villa Marie-Louise.*"}, {"op": "ins", "text": "*Liste nominative 1891, « La Halle » **[F]**. Source : [AD86, recensement Les Ormes 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). Prouve René d’Argenson à la Halle. Ne prouve pas un dépouillement exhaustif de tout le bourg ; Salis non vu sur *ces* vues.*"}, {"op": "del", "text": "*Rodolphe Salis **[F]** illustratif. Fichier local du dossier (Wikimedia). Identité connue ; propriété de la villa **[S]/[H]** ; absence dans l’état civil Ormes 1883-92 **[F]**.*"}, {"op": "ins", "text": "*Rodolphe Salis **[F]** illustratif. Source : [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Portrait_de_Rodolphe_Salis.jpg) ([fichier](https://upload.wikimedia.org/wikipedia/commons/0/05/Portrait_de_Rodolphe_Salis.jpg)). Identité connue ; propriété de la villa **[S]/[H]** ; TD Ormes 1883-92 sans Salis **[F]**.*"}, {"op": "del", "text": "Vers 1903, une carte postale de la rue Pierre-d’Argenson montre « la Villa Marie-Louise à droite » **[F] icono**."}, {"op": "ins", "text": "Vers 1903, une carte postale de la rue Pierre-d’Argenson montre « la Villa Marie-Louise à droite » **[F]**."}, {"op": "del", "text": "*Villa Marie-Louise à droite **[F] icono**. [Source Geneanet](https://en.geneanet.org/postcards/view/7781445).*"}, {"op": "del", "text": ""}, {"op": "del", "text": "Le prénom (ou le nom de maison) est donc ancien et bien attaché à *cette* rue. En revanche, le nom de famille **Boulanger**, parfois ajouté sur Internet, ne repose pour l’instant que sur une modification Wikipédia de 2025, anonyme et sans source **[S]**."}, {"op": "del", "text": ""}, {"op": "del", "text": "→ [Wikipédia - Les Ormes (Vienne)](https://fr.wikipedia.org/wiki/Les_Ormes_(Vienne))"}, {"op": "ins", "text": "*Villa Marie-Louise à droite **[F]**. Source : [Geneanet #7781445](https://en.geneanet.org/postcards/view/7781445). Prouve le *nom* sur *cette* rue. Ne prouve pas le calage AB 143 / n°13 **[H]**.*"}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Le prénom (ou le nom de maison) est donc ancien et bien attaché à *cette* rue — pas, à lui seul, une preuve que le bâtiment photographié = AB 143 / n°13 **[H]**. En revanche, le nom de famille **Boulanger**, parfois ajouté sur Internet, ne repose pour l’instant que sur une modification Wikipédia du **17 juin 2025**, anonyme et sans source **[S]**."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "→ [Wikipédia — Les Ormes (Vienne), rév. 226575693](https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&oldid=226575693)"}, {"op": "del", "text": "Si l’on fait le calcul, on arrive vers 1950 - mais c’est une estimation à partir d’un témoignage, pas une date lue sur un acte **[S]/[ÀV]**. Un annuaire contemporain place bien **Fabrice Audy** au **13 rue Pierre-d’Argenson**, 86220 Les Ormes **[F] data**."}, {"op": "del", "text": ""}, {"op": "del", "text": "→ [Annuaire - Audy Fabrice, Les Ormes](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)"}, {"op": "ins", "text": "Si l’on fait le calcul, on arrive vers 1950 - mais c’est une estimation à partir d’un témoignage, pas une date lue sur un acte **[S]/[ÀV]**. Un **annuaire agrégateur** contemporain place bien **Fabrice Audy** au **13 rue Pierre-d’Argenson**, 86220 Les Ormes **[F]** — adresse d’annuaire, **pas** un titre de propriété ni une date d’acquisition."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "→ [Annuaire agrégateur - Audy Fabrice, Les Ormes](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)"}, {"op": "del", "text": "Sur le recensement 1891 du bourg : **aucun Audy** **[F]** - [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). La table décennale **1893-1902** enregistre un mariage **Audy** aux Ormes le **16 avril 1898** :"}, {"op": "ins", "text": "Sur le recensement 1891 (*vues consultées*) : **Audy non repéré** **[F]** — [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). La table décennale **1893-1902** enregistre un mariage **Audy** aux Ormes le **16 avril 1898** :"}, {"op": "del", "text": "Dans le registre du notaire Lasserré, à la date du 7 novembre 1890, on lit une vente à **Rodolphe Salis**, « directeur du Chat Noir » à Paris : une **pièce de terre en vigne**, lieu-dit **les Ormes**, commune de **Naintré**, pour **3 300 francs** **[F]**. La surface est d’environ **un hectare et demi** - bien plus grande que la parcelle actuelle de la villa (366 m²) **[F]**."}, {"op": "ins", "text": "Dans le registre du notaire Lasserré, à la date du 7 novembre 1890, on lit une vente à **Rodolphe Salis**, « directeur du Chat Noir » à Paris : une **pièce de terre en vigne**, lieu-dit **les Ormes**, commune de **Naintré**, pour **3 300 francs** **[F]**. Contenance : **1 ha 48 a 4 ca** — sans rapport avec les 366 m² de la villa **[F]**."}, {"op": "del", "text": "*Lieu-dit « les Ormes », commune de Naintré, ~1,5 ha, 3 300 F **[F]**. Extrait local du dossier ; notice : [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Toujours la vigne, jamais la villa.*"}, {"op": "ins", "text": "*Lieu-dit « les Ormes », commune de Naintré, 1 ha 48 a 4 ca, 3 300 F **[F]**. Extrait local du dossier ; notice : [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Toujours la vigne, jamais la villa.*"}, {"op": "del", "text": "En août 1892, Salis devient adjudicataire de la Tour de Naintré - cela, les documents le confirment **[F]**. À sa mort en 1897, un inventaire après décès est dressé à Paris **[F]**. La **notice** qui décrit ce dossier ne mentionne pas la commune des Ormes **[F]**."}, {"op": "ins", "text": "En août 1892, Salis devient adjudicataire de la Tour de Naintré - cela, les documents le confirment **[F]**. À sa mort en 1897, un inventaire après décès est dressé à Paris **[F]**. La **notice** qui décrit ce dossier ne mentionne pas la commune des Ormes **[F]** — silence de *notice*, pas conclusion sur le contenu des feuillets."}, {"op": "del", "text": "Le dossier complet (une douzaine de feuillets) n’a pas encore été lu en entier : on ne sait pas si la villa y figure **[H]/[ÀV]**."}, {"op": "del", "text": ""}, {"op": "del", "text": "### Des silences qui comptent - sans trop en faire"}, {"op": "ins", "text": "Le dossier complet (une douzaine de feuillets) n’a pas encore été lu en entier : on ne sait pas si la villa y figure **[H]/[ÀV]**. Ce silence de notice **ne** permet **pas** de dire que la villa est « hors succession »."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "### Des silences qui comptent"}, {"op": "del", "text": "→ [Gallica](https://gallica.bnf.fr/) (recherches ciblées du dossier)"}, {"op": "del", "text": ""}, {"op": "del", "text": "Absence constatée dans *ces* publications seulement **[F]** - pas une preuve d’inexistence de la villa ni d’absence de titre Salis."}, {"op": "ins", "text": "→ Bilan recherches presse / Gallica : fichier local du dossier `09_Sources_Archives/Gallica_BnF/BILAN_RECHERCHE.md` (pas une page d’accueil Gallica)."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Absence constatée dans *ces* textes et dans le bilan local seulement **[F]** — pas une preuve d’inexistence de la villa ni d’absence de titre Salis."}, {"op": "del", "text": "Déjà citée plus haut ; on la rappelle ici comme preuve du *nom* Marie-Louise sur *cette* rue **[F] icono**."}, {"op": "ins", "text": "Déjà citée plus haut ; on la rappelle ici comme preuve du *nom* Marie-Louise sur *cette* rue **[F]**."}, {"op": "del", "text": "*Ne dit rien de Deglane, ni de Salis propriétaire, ni d’un nom de famille Boulanger.*"}, {"op": "ins", "text": "*Villa Marie-Louise à droite, légende catalogue « vue prise vers 1903 » **[F]**. Source : [Geneanet #7781445](https://en.geneanet.org/postcards/view/7781445). Prouve le *nom* sur *cette* rue. Ne prouve pas Deglane, ni Salis propriétaire, ni Boulanger, ni le calage AB 143 / n°13 **[H]**.*"}, {"op": "del", "text": "Toiture débordante, bois apparent, baies hautes, jeux de brique et de pierre, frises, ferronnerie, vitraux à médaillons : le vocabulaire est celui d’une **villégiature éclectique de la fin du XIXᵉ siècle**, pas celui de l’Art déco géométrique des années 1920 **[H]**. Pour un projet de restauration, on retient donc plutôt « Belle Époque / vers 1890 » comme orientation - en sachant que c’est une lecture raisonnée de l’apparence, pas une date lue sur un permis. Le PLU, lui, dit « art déco » **[F] doc**."}, {"op": "ins", "text": "Toiture débordante, bois apparent, baies hautes, jeux de brique et de pierre, frises, ferronnerie, vitraux à médaillons : le vocabulaire est celui d’une **villégiature éclectique de la fin du XIXᵉ siècle**, pas celui de l’Art déco géométrique des années 1920 **[H]**. Pour un projet de restauration, on retient donc plutôt « Belle Époque / vers 1890 » comme orientation - en sachant que c’est une lecture raisonnée de l’apparence, pas une date lue sur un permis. Le PLU, lui, dit « art déco » **[F]**."}, {"op": "del", "text": "*Portail et ferronnerie, état récent **[S]**. Source : [Days on the Claise](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html).*"}, {"op": "ins", "text": "*Portail et ferronnerie, état récent **[S]**. Source : [Days on the Claise](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html). Aspect contemporain ; pas une datation 1890.*"}, {"op": "del", "text": "**L’architecte.** Une notice sérieuse dit : Deglane, une villa aux Ormes, 1890 **[F]** - [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf). La tradition locale dit : c’est *celle-ci* **[S]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/) / [blog](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html). La carte postale dit : sur *cette* rue, le nom Marie-Louise existe déjà vers 1903 **[F] icono** - [Geneanet](https://en.geneanet.org/postcards/view/7781445). Les trois indices vont dans le même sens, mais ils ne se valent pas : le premier est un fait de catalogue ; l’identification avec le n°13 reste **[H]/[ÀV]**."}, {"op": "del", "text": ""}, {"op": "del", "text": "**Le propriétaire.** Tradition : Salis **[S]/[H]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/), [France 3](https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html). Acte 1890 : vigne à Naintré **[F]** - [registre AD86](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). Notice d’inventaire 1897 : pas de commune Les Ormes **[F]** - [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Tables décennales Ormes **1883-1892** et **1893-1902** : **aucun Salis** ; naissance **Salsier Louis**, 1er avril 1891 **[F]** - [TD 1883-92](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg) · [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c). Recensement 1891 : pas de Salis ; **René d’Argenson** à la Place de la Halle **[F]** - [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) · [extrait](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg). Pas de titre de propriété établi pour la villa."}, {"op": "ins", "text": "**L’architecte.** Trois éléments distincts, de poids inégal : (1) notice AGORHA — Deglane, une villa aux Ormes, 1890 **[F]** - [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf) ; (2) tradition locale — c’est *celle-ci* **[S]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/) / [blog](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html) ; (3) carte postale — sur *cette* rue, le nom Marie-Louise existe déjà vers 1903 **[F]** - [Geneanet](https://en.geneanet.org/postcards/view/7781445). Ce n’est **pas** une triple corroboration indépendante que Deglane a bâti le n°13 : le premier est un fait de catalogue ; le deuxième un courant narratif unique ; le troisième un nom de maison sur la rue. L’identification avec le n°13 / AB 143 reste **[H]/[ÀV]**."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "**Le propriétaire.** Tradition : Salis **[S]/[H]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/), [France 3](https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html). Acte 1890 : vigne à Naintré **[F]** - [registre AD86](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). Notice d’inventaire 1897 : pas de commune Les Ormes **[F]** (corps non lu = encore **[H]/[ÀV]**) - [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Tables décennales Ormes **1883-1892** et **1893-1902** : **aucun Salis** ; naissance **Salsier Louis**, 1er avril 1891 **[F]** - [TD 1883-92](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg) · [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c). Recensement 1891 (*vues consultées*) : Salis non repéré ; **René d’Argenson** à la Place de la Halle **[F]** - [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) · [extrait](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg). Pas de titre de propriété établi pour la villa."}, {"op": urisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)."}, {"op": "del", "text": "3. **Le dossier d’inventaire après décès** de Salis, feuillets complets - [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)."}, {"op": "ins", "text": "3. **Le dossier d’inventaire après décès** de Salis, feuillets complets - [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Silence de notice ≠ « hors succession »."}, {"op": "del", "text": "7. **L’acte d’acquisition** de la famille Audy (titre / matrices) - pour sortir de l’estimation « depuis 70 ans » ([OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)). *Déjà [F] : Fabrice Audy au n°13 ([annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)) ; mariage **Audy Ludger Eugène × Coutard Camille Angèle**, 16 avril 1898, aux Ormes ([TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg)) - présence Audy locale dès 1898, **sans** preuve que ce soit l’achat de la villa.*"}, {"op": "del", "text": "8. **Recensements 1901 / 1906** - Audy / Salis / adresse rue Pierre-d’Argenson (REC 1891 : pas de Salis sur le bourg consulté - [REC](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) ; TD 1893-1902 : Audy 1898, pas de Salis)."}, {"op": "ins", "text": "7. **L’acte d’acquisition** de la famille Audy (titre / matrices) - pour sortir de l’estimation « depuis 70 ans » ([OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)). *Déjà [F] : Fabrice Audy au n°13 ([annuaire agrégateur](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)) ; mariage **Audy Ludger Eugène × Coutard Camille Angèle**, 16 avril 1898, aux Ormes ([TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extr au n°13 aujourd’hui **[F] data** - [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) ; acquisition de *cette* maison ~1950 encore **[S]/[ÀV]**."}, {"op": "del", "text": ""}, {"op": "del", "text": "Pour un projet : orientation Belle Époque / fin XIXᵉ **[H]** ; abords MH **[F]** ; centre-bourg probable **[H]/[ÀV]** ; tradition Chat Noir / Deglane / Marie-Louise **[S]** (pas un titre) ; monogramme, vitraux et plafond à documenter sans datation d’autorité **[H]/[S]** ; volume ancien vs ajouts (piscine **[F]** ; Audy local dès 1898 **[F]** + domicile contemporain **[F] data** ; titre villa Audy **[S]/[ÀV]**)."}, {"op": "ins", "text": "La Villa Caroline est adressée, cadastrée (366 m² PCI), photographiée, située dans le régime des abords du château **[F]** - [cadastre](https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394), [IGN](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19), [PLU](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0). Nom Marie-Louise sur *cette* rue : carte postale du début du XXᵉ siècle **[F]** - [Geneanet](https://en.geneanet.org/postcards/view/7781445) ; identité n°13 / AB 143 : **[H]**. Notice AGORHA : villa aux Ormes par Deglane en 1890 **[F]** - [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf) ; identification avec le n°13 **[H]/[ÀV]**. Salis documenté dans la région **[F]** ; propriétaire de *cette* maison : tradition locale seulement **[S]/[H]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/). Acte 1890 solide le concernant ici : vigne à Naintré **[F]** - [registre AD86](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). État civil Ormes **1883-1902** : **pas de Salis** **[F]** - [TD 1883-92](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) ; mariage **Audy × Coutard** 16 avril 1898 **[F]** - [TD](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg). Fabrice Audy au n°13 aujourd’hui **[F]** (annuaire agrégateur) - [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) ; acquisition de *cette* maison ~1950 encore **[S]/[ÀV]**. Inventaire 1897 : silence de *notice* seulement ; corps non lu = encore **[H]/[ÀV]**."}, {"op": "ins", "text": ""}, {"op": "ins", "text": "Pour un projet : orientation Belle Époque / fin XIXᵉ **[H]** ; abords MH (avis ABF) **[F]** ; centre-bourg probable **[H]/[ÀV]** ; tradition Chat Noir / Deglane / Marie-Louise **[S]** (pas un titre) ; monogramme, vitraux et plafond à documenter sans datation d’autorité **[H]/[S]** ; volume ancien vs ajouts (piscine **[F]** ; Audy local dès 1898 **[F]** + domicile contemporain **[F]** ; titre villa Audy **[S]/[ÀV]**)."}, {"op": "del", "text": "| 1891 | REC : René d’Argenson, Place de la Halle ; pas de Salis au bourg | **[F]** | [REC](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) · [extrait](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg) |"}, {"op": "ins", "text": "| 1891 | REC (*vues lues*) : René d’Argenson, Place de la Halle ; Salis non repéré | **[F]** | [REC](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) · [extrait](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg) |"}, {"op": "del", "text": "| 17 août 1892 | Salis acquiert la Tour de Naintré | **[F]** | [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9) |"}, {"op": "del", "text": "| 20 mars 1897 | Mort de Salis ; inventaire | **[F]** · villa Ormes non lue = **[H]/[ÀV]** | [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9) |"}, {"op": "del", "text": "| Vers 1903 | CP Villa Marie-Louise | **[F] icono** | [Geneanet](https://en.geneanet.org/postcards/view/7781445) |"}, {"op": "ins", "text": "| 17 août 1892 | Salis acquiert la Tour de Naintré | **[F]** | [Folio inventaire / latour](https://latourdenaintre.fr/wp-content/uploads/2026/09/FRAN_0159_22721_L-medium.jpg) · [notice FA](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9) |"}, {"op": "ins", "text": "| 20 mars 1897 | Mort de Salis ; inventaire | **[F]** · silence *notice* Ormes ; corps non lu = **[H]/[ÀV]** | [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9) |"}, {"op": "ins", "text": "| Vers 1903 | CP Villa Marie-Louise (nom sur *cette* rue) | **[F]** · ID n°13 = **[H]** | [Geneanet](https://en.geneanet.org/postcards/view/7781445) |"}, {"op": "del", "text": "| Contemporain | Fabrice Audy @ 13 rue P.-d’Argenson | **[F] data** | [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) |"}, {"op": "del", "text": "| 2025 | Wiki « Boulanger » | **[S]** | [Wikipédia](https://fr.wikipedia.org/wiki/Les_Ormes_(Vienne)) |"}, {"op": "ins", "text": "| Contemporain | Fabrice Audy @ 13 rue P.-d’Argenson (annuaire agrégateur) | **[F]** | [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) |"}, {"op": "ins", "text": "| 2025 | Wiki « Boulanger » (rév. anonyme) | **[S]** | [oldid 226575693](https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&oldid=226575693) |"}, {"op": "del", "text": "*AGORHA* : base biographique d’architectes (INHA). *Matrices* : registres du cadastre qui suivent les propriétaires dans le temps. *Répertoire / minute* : le répertoire est l’index du notaire ; la minute est l’acte complet. *Inventaire après décès* : liste des biens dressée après une mort, pour la succession. *Abords MH* : zone de 500 m autour d’un monument historique, où les travaux sont encadrés."}, {"op": "ins", "text": "*AGORHA* : base biographique d’architectes (INHA). *Matrices* : registres du cadastre qui suivent les propriétaires dans le temps. *Répertoire / minute* : le répertoire est l’index du notaire ; la minute est l’acte complet. *Inventaire après décès* : liste des biens dressée après une mort, pour la succession. *Abords MH* : périmètre de 500 m autour d’un monument historique (régime des abords) ; travaux sensibles soumis à l’avis de l’ABF. *PCI* : plan cadastral informatisé (surface figurative, pas arpentage géomètre). *[F]* : donnée d’annuaire / base contemporaine — pas un acte de propriété."}], "headPlain": "# Villa Caroline\r\n\r\n**13 rue Pierre-d’Argenson, 86220 Les Ormes**  \r\n*Nom « Villa Marie-Louise » attesté sur cette rue vers 1903 **[F]** ; identité avec le n°13 / AB 143 encore **[H]**.*\r\n\r\n*Dossier de recherche, novembre 2026.*\r\n\r\n---\r\n\r\n**Comment lire les niveaux de confiance**\r\n\r\n| Tag | Sens |\r\n|-----|------|\r\n| **[F]** | Fait établi (document officiel, archive, photo datée contrôlée) |\r\n| **[S]** | Source secondaire (presse, blog, office de tourisme, tradition rapportée) |\r\n| **[H]** | Hypothèse plausible, pas encore prouvée |\r\n| **[ÀV]** | À vérifier — cité ailleurs, pas encore contrôlé sur pièce |\r\n\r\nAprès chaque source : **lien cliquable**, citation courte, et **image** quand elle existe.\r\n\r\n---\r\n\r\n## En quelques mots\r\n\r\n### A — Établi sur pièces\r\n\r\nLa Villa Caroline porte l’adresse **13 rue Pierre-d’Argenson**, parcelle cadastrale **AB 143** (réf. nationale 86183000AB0143) **[F]**. Surface affichée au plan cadastral informatisé (PCI) : **366 m²** — figure cadastrale, **non** arpentage géomètre **[F]**.\r\n\r\n→ [Cadastre — AB 143](https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394)\r\n\r\nVers 1903, une carte postale de *cette* rue légende « la Villa Marie-Louise à droite » **[F]**.\r\n\r\n→ [Geneanet — carte postale #7781445](https://en.geneanet.org/postcards/view/7781445)\r\n\r\nVolume principal déjà là sur les orthophotos **1950–1965** ; piscine absente alors, visible au plus tard **2000–2005** **[F]**.\r\n\r\n→ [IGN — Remonter le temps](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19)\r\n\r\nMaison **non** classée monument historique **[F]**. Elle entre dans le **régime des abords** du château (périmètre de 500 m) : travaux sensibles soumis à l’**avis de l’architecte des Bâtiments de France (ABF)** **[F]**.\r\n\r\n→ [PLU / abords — GPU](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0)  \r\n→ [POP — château / Mérimée PA00105572](https://www.pop.culture.gouv.fr/notice/merimee/PA00105572)\r\n\r\nNotice AGORHA : Deglane a « une villa aux Ormes (Vienne) en 1890 » **[F]** (notice biographique seulement).\r\n\r\n→ [AGORHA — notice Deglane](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf)\r\n\r\nLe 7 novembre 1890, Salis achète une vigne lieu-dit « les Ormes », commune de **Naintré** — **1 ha 48 a 4 ca**, 3 300 F — **pas** la villa **[F]**. Tour de Naintré en 1892 ; mort à Naintré en 1897 **[F]**.\r\n\r\n→ [AD86 — répertoire Lasserré, vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37)  \r\n→ [FranceArchives — inventaire / succession Salis](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)\r\n\r\nTables décennales Ormes **1883–1902** : **aucun Salis** indexé (N/M/D) **[F]** ; naissance **Salsier** Louis, 1891 (**≠** Salis) **[F]**. Sur le recensement 1891 (*vues consultées* : Place de la Halle, Grande Rue) : **Salis non repéré** **[F]** (négatif limité aux vues lues).\r\n\r\n→ [TD Ormes 1883–1892](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [TD 1893–1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c)  \r\n→ [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d)\r\n\r\nMariage **Audy Ludger × Coutard**, 16 avril 1898, aux Ormes **[F]**. Annuaire agrégateur contemporain : **Fabrice Audy** au n°13 **[F]** — adresse d’annuaire, **pas** un titre de propriété.\r\n\r\n→ [TD mariages 1893–1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c)  \r\n→ [Annuaire agrégateur — Audy Fabrice](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)\r\n\r\nLa cote AN **AJ/52/361** citée par AGORHA est un **dossier d’élève** (lettres, notes), **pas** un fonds de plans de la villa **[F]**.\r\n\r\n→ [AGORHA — notice Deglane](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf)\r\n\r\n### B — Tradition et questions ouvertes\r\n\r\nQue la carte postale « Marie-Louise » montre *exactement* le bâtiment du n°13 / AB 143 reste **[H]** tant que calage façade / matrice manquent.\r\n\r\nIdentification Deglane = n°13 / AB 143 : **[H]/[ÀV]**.\r\n\r\nTradition locale (office de tourisme, presse, blog — **un** courant) : Henri Deglane architecte en 1890, Rodolphe Salis commanditaire pour une Marie-Louise, famille Audy vers le milieu du XXᵉ et renommage Caroline en hommage à Caroline Waldé **[S]**. Acquisition de *cette* maison ≈1950 et lien Waldé : **[S]/[ÀV]** seulement — pas une date d’acte.\r\n\r\n→ [OT Grand Châtellerault, 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)\r\n\r\nSalis maître d’ouvrage de *cette* maison : **[S]/[H]**. Patronyme **Boulanger** pour Marie-Louise : rév. Wikipédia anonyme 2025, sans source **[S]**.\r\n\r\n→ [Wiki — rév. 17/06/2025](https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&oldid=226575693)\r\n\r\nStyle observé : Belle Époque / fin XIXᵉ **[H]** ; le PLU écrit « art déco » **[F]**. Zone UA (centre-bourg) : **[H]/[ÀV]**. Vitrail / plafond « d’origine 1890 » : **[H]** (état récent photographié seulement). Notice inventaire 1897 : silence sur la commune des Ormes **[F]** ; corps du dossier **non lu** → présence éventuelle de la villa encore **[H]/[ÀV]** (pas « hors succession »).\r\n\r\n→ [PLU — GPU](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0)  \r\n→ [FranceArchives — notice inventaire](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)\r\n\r\nPièces encore utiles : matrices AB 143, minute 1890, inventaire 1897 complet, REC 1901/1906, acte d’acquisition Audy.\r\n\r\n---\r\n\r\n## 1. La question que l’on se pose\r\n\r\nQui a fait bâtir la maison du 13 rue Pierre-d’Argenson ? Pour qui ? Et sous quel titre de propriété ?\r\n\r\nLa tradition locale répond : Deglane architecte, Salis commanditaire, Marie-Louise dédicataire, famille Audy au XXᵉ siècle **[S]**.\r\n\r\nLe 7 novembre 1890, Rodolphe Salis achète une pièce de terre en vigne au lieu-dit « les Ormes », dans la **commune de Naintré**. Ce n’est **pas** la commune des Ormes. Ce n’est **pas** la villa **[F]**.\r\n\r\n→ [Archives Deux-Sèvres-Vienne - répertoire Lasserré, vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37)\r\n\r\n---\r\n\r\n## 2. La maison et son quartier\r\n\r\n### Face au domaine d’Argenson\r\n\r\nLes Ormes ont une longue histoire seigneuriale : domaine attesté dès la fin du XIVᵉ siècle, passage aux Argenson en 1729, grandes écuries du XVIIIᵉ, reconstruction du logis au tournant du XXᵉ **[F]**.\r\n\r\n→ [POP - notice château / domaine IA86000547](https://pop.culture.gouv.fr/notice/merimee/IA86000547)\r\n\r\nLa villa s’installe dans ce paysage de bourg recomposé, côté est du parc, sur une lanière entre la rue et le jardin. L’office de tourisme relie la maison au château voisin, notamment via le vitrail rabelaisien de la salle à manger **[S]**.\r\n\r\n→ [OT Grand Châtellerault, 8 sept. 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)\r\n\r\n![Vitrail à sujet rabelaisien](../08_Iconographie/Captures_web/2026-11-13_OT_vitraux_rabelais.webp)\r\n\r\n*Vitrail de la salle à manger (reportage OT 2020) **[S]**. Source : [tourisme-chatellerault.fr](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/). État récent ; origine 1890 non prouvée **[H]**.*\r\n\r\n### La parcelle\r\n\r\n| | | |\r\n|---|---|---|\r\n| Adresse | 13 rue Pierre-d’Argenson, 86220 Les Ormes | **[F]** |\r\n| Parcelle | AB 143 (référence nationale 86183000AB0143) | **[F]** |\r\n| Surface | 366 m² (PCI — figure cadastrale, non arpentée géomètre) | **[F]** |\r\n| Emplacement | environ 46,975° N / 0,603° E | **[F]** |\r\n\r\n→ [Carte cadastrale interactive - AB 143](https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394)\r\n\r\nLa parcelle voisine au sud (AB 144, 144 m²) prolonge le jardin : quand on imagine « la villa et son jardin », on ne regarde pas seulement les 366 m² **[F]**.\r\n\r\n![Parcelle AB 143 sur le cadastre actuel](../05_Cadastre_Plans/Cadastre_actuel/capture_AB0143_selectionnee.png)\r\n\r\n*Parcelle AB 143 **[F]**. Source : [cadastre.data.gouv.fr](https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394). Fixe l’adresse et l’emprise actuelle - pas le propriétaire historique ni la date de construction.*\r\n\r\n### Ce que disent les règles d’urbanisme\r\n\r\nLe plan local d’urbanisme (approuvé en 2018) range la maison parmi le patrimoine bâti **non classé** monument historique, avec la mention « villa de style art déco » **[F]**.\r\n\r\n→ [Document PLU - Géoportail de l’urbanisme](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0)  \r\n→ [Rapport de présentation (PDF)](https://www.geoportail-urbanisme.gouv.fr/api/document/567b5bf6a339134f0bc34c21786068d0/files/86183_rapport_20180910.pdf)\r\n\r\nMention présente dans le document officiel. Style observé : villégiature Belle Époque / fin XIXᵉ plutôt qu’Art déco des années 1920 **[H]** - hypothèse de travail, pas datation prouvée.\r\n\r\nLa rue relève **très probablement** du centre-bourg (zone dite « UA »), où l’aspect architectural compte **[H]/[ÀV]** - à confirmer sur le [règlement graphique GPU](https://www.geoportail-urbanisme.gouv.fr/map/?documentId=567b5bf6a339134f0bc34c21786068d0#tile=1&lon=0.603394&lat=46.975082&zoom=18). La maison se trouve aussi dans le **périmètre de 500 mètres** autour des monuments protégés du château : elle relève du **régime des abords** ; les travaux susceptibles d’affecter l’aspect extérieur sont soumis à l’**avis de l’architecte des Bâtiments de France (ABF)** **[F]**. Elle n’est en revanche **pas** elle-même sur la liste du classement du domaine **[F]** - [base POP / Mérimée PA00105572](https://www.pop.culture.gouv.fr/notice/merimee/PA00105572) (contexte château).\r\n\r\n### Ce que montrent les photos aériennes\r\n\r\nDès les années 1950-1965, le volume principal est déjà là **[F]**. Il n’y a pas encore de piscine **[F]**. Entre 2000 et 2005, une piscine rectangulaire apparaît dans le jardin ; elle reste ensuite **[F]**.\r\n\r\n→ [IGN - Remonter le temps (comparer)](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19)\r\n\r\n![Vue aérienne 1950-1960, sans piscine](../05_Cadastre_Plans/Photos_aeriennes_IGN/1950-1960.png)\r\n\r\n*Ortho 1950-1960 **[F]**. Source : [IGN Remonter le temps](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19). Maison présente ; pas de piscine. Ne prouve ni 1890 ni Deglane.*\r\n\r\n![Vue aérienne 2000-2005, avec piscine](../05_Cadastre_Plans/Photos_aeriennes_IGN/2000-2005.png)\r\n\r\n*Ortho 2000-2005 **[F]**. Source : [même comparateur IGN](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19). Piscine visible ; année exacte du creusement **[H]**.*\r\n\r\nVolume principal conservé dans ses grandes lignes depuis le milieu du XXᵉ **[F]** ; piscine = ajout, visible au début du XXIᵉ **[F]**. Attribution du creusement à la famille Audy : tradition locale **[S]** - [OT 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/).\r\n\r\n---\r\n\r\n## 3. Les personnes du récit\r\n\r\n### Henri Deglane (1855-1931), l’architecte\r\n\r\nPrix de Rome, puis l’un des architectes du Grand Palais à Paris. Dans la notice de référence qui lui est consacrée (base AGORHA, Institut national d’histoire de l’art), on lit qu’il a réalisé des constructions particulières, « **dont une villa aux Ormes (Vienne) en 1890** » **[F]**.\r\n\r\n> « …constructions particulières dont une villa aux Ormes (Vienne) en 1890… »\r\n\r\n→ [AGORHA - notice Deglane (ark INHA)](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf)\r\n\r\n![Portrait d’Henri Deglane](../08_Iconographie/Deglane/wiki_Henri_Deglane_portrait_500.jpg)\r\n\r\n*Henri Deglane (portrait ≤1905) **[F]** illustratif. Source : [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Henri_Deglane.jpg) (fichier local du dossier). Identité de l’architecte ; pas le lien avec AB 143.*\r\n\r\nDeglane a donc une villa aux Ormes, en 1890, dans son catalogue **[F]**. Que ce soit le numéro 13 de la rue Pierre-d’Argenson n’est pas établi : la [carte postale Marie-Louise](https://en.geneanet.org/postcards/view/7781445) sur cette rue nourrit l’hypothèse, sans plan, permis ni matrice pour la sceller **[H]/[ÀV]**.\r\n\r\nLa tradition locale attribue la maison à Deglane à cette adresse **[S]** :\r\n\r\n→ [Office de tourisme, 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)  \r\n→ [Days on the Claise, févr. 2021](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html)\r\n\r\nOT, blog et presse reprennent en pratique **un même courant** narratif, pas trois preuves indépendantes.\r\n\r\n### Rodolphe Salis (1851-1897) et le Chat Noir\r\n\r\nFondateur du Chat Noir à Paris, époux de Marie Gabrielle Thiennet, acquéreur de la Tour de Naintré en 1892 **[F]**, mort à Naintré en 1897 **[F]**. Origine « châtelleraudaise » parfois rapportée : **[S]** (acte de naissance non cité ici).\r\n\r\n→ [FranceArchives - inventaire après décès / notice succession](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)\r\n\r\nAutour des Ormes, on raconte qu’il aurait fait bâtir la villa pour une « Marie-Louise » **[S]**. L’office de tourisme, un reportage France 3 et un blog anglais reprennent cette version. En pratique, c’est **un même courant de tradition locale**, pas trois sources indépendantes.\r\n\r\n→ [OT 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)  \r\n→ [France 3 - Itinéraire bis aux Ormes](https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html)  \r\n→ [Days on the Claise](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html)\r\n\r\nAucun acte consulté jusqu’ici ne montre Salis propriétaire de la parcelle de la villa. L’acte de 1890 que l’on tient vraiment - et que l’on peut lire - concerne une vigne à Naintré **[F]** - [vue 37 du registre](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). Salis est donc un personnage **documenté** dans la région **[F]** ; son rôle de maître d’ouvrage de *cette* maison reste, pour l’instant, une tradition **[S]/[H]**.\r\n\r\nDans les *tables décennales* des Ormes pour 1883-1892, le nom **Salis** n’est indexé ni aux naissances, ni aux mariages, ni aux décès **[F]**.\r\n\r\n→ [Tables décennales Les Ormes 1883-1892 (AD86)](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b)\r\n\r\nSous la lettre S des naissances figure **Salsier Louis**, 1er avril 1891 **[F]** :\r\n\r\n![Table décennale - Salsier Louis, 1er avril 1891](../08_Iconographie/Archives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg)\r\n\r\n*Extrait de la table décennale des naissances, lettre S **[F]**. Source : [AD86, tables 1883-1892](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b). Prouve un **Salsier** aux Ormes en 1891. Ne prouve pas un Salis habitant ou propriétaire de la villa.*\r\n\r\nSur le recensement de 1891, *vues consultées* (Place de la Halle, Grande Rue) : **Salis non repéré** **[F]** — [recensement 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). À la Place de la Halle : **René d’Argenson**, propriétaire, avec deux enfants et du personnel **[F]** :\r\n\r\n![Recensement 1891 - René d’Argenson, Place de la Halle](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg)\r\n\r\n*Liste nominative 1891, « La Halle » **[F]**. Source : [AD86, recensement Les Ormes 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). Prouve René d’Argenson à la Halle. Ne prouve pas un dépouillement exhaustif de tout le bourg ; Salis non vu sur *ces* vues.*\r\n\r\n![Portrait de Rodolphe Salis](../08_Iconographie/Salis_Chat_Noir/wiki_Portrait_de_Rodolphe_Salis_500.jpg)\r\n\r\n*Rodolphe Salis **[F]** illustratif. Source : [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Portrait_de_Rodolphe_Salis.jpg) ([fichier](https://upload.wikimedia.org/wikipedia/commons/0/05/Portrait_de_Rodolphe_Salis.jpg)). Identité connue ; propriété de la villa **[S]/[H]** ; TD Ormes 1883-92 sans Salis **[F]**.*\r\n\r\n### Marie-Louise - un prénom de maison, pas un état civil\r\n\r\nVers 1903, une carte postale de la rue Pierre-d’Argenson montre « la Villa Marie-Louise à droite » **[F]**.\r\n\r\n→ [Geneanet - carte postale #7781445](https://en.geneanet.org/postcards/view/7781445)\r\n\r\n![Même carte postale (rappel)](../08_Iconographie/Cartes_postales/Geneanet_7781445_Villa_Marie-Louise_1903.jpg)\r\n\r\n*Villa Marie-Louise à droite **[F]**. Source : [Geneanet #7781445](https://en.geneanet.org/postcards/view/7781445). Prouve le *nom* sur *cette* rue. Ne prouve pas le calage AB 143 / n°13 **[H]**.*\r\n\r\nLe prénom (ou le nom de maison) est donc ancien et bien attaché à *cette* rue — pas, à lui seul, une preuve que le bâtiment photographié = AB 143 / n°13 **[H]**. En revanche, le nom de famille **Boulanger**, parfois ajouté sur Internet, ne repose pour l’instant que sur une modification Wikipédia du **17 juin 2025**, anonyme et sans source **[S]**.\r\n\r\n→ [Wikipédia — Les Ormes (Vienne), rév. 226575693](https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&oldid=226575693)\r\n\r\nUn reportage télé parle d’une « maîtresse » sans donner ce nom **[S]** - [France 3](https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html). On garde le prénom ; on laisse le patronyme de côté jusqu’à une preuve d’état civil **[ÀV]**.\r\n\r\n### La famille Audy et le nom Caroline\r\n\r\nSelon l’office de tourisme (2020), Fabrice Audy présente une maison « dans sa famille depuis 70 ans », rebaptisée Villa Caroline en hommage à sa mère, Caroline Waldé **[S]**.\r\n\r\n→ [OT - « Les Ormes, la surprise du chef »](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)\r\n\r\nSi l’on fait le calcul, on arrive vers 1950 - mais c’est une estimation à partir d’un témoignage, pas une date lue sur un acte **[S]/[ÀV]**. Un **annuaire agrégateur** contemporain place bien **Fabrice Audy** au **13 rue Pierre-d’Argenson**, 86220 Les Ormes **[F]** — adresse d’annuaire, **pas** un titre de propriété ni une date d’acquisition.\r\n\r\n→ [Annuaire agrégateur - Audy Fabrice, Les Ormes](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)\r\n\r\nD’autres archives (liées au peintre Tang Haywen) croisent les noms Audy / Caroline / Fabrice et parlent d’une « Villa Caroline », avec une géographie un peu floue (« Loire ») **[H]/[ÀV]**.\r\n\r\n→ [Tang Haywen Archives - Raymond Audy](https://www.tanghaywenarchives.com/fr/friends/raymond-audy)\r\n\r\nNoms convergents pour le XXᵉ siècle ; date d’acquisition et chaîne cadastrale **[ÀV]**.\r\n\r\nSur le recensement 1891 (*vues consultées*) : **Audy non repéré** **[F]** — [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d). La table décennale **1893-1902** enregistre un mariage **Audy** aux Ormes le **16 avril 1898** :\r\n\r\n→ [Tables décennales Les Ormes 1893-1902 (AD86)](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c)\r\n\r\n![TD mariages - Audy × Coutard, 16 avril 1898](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg)\r\n\r\n*Ligne de la table décennale des mariages **[F]** : « Audy Ludger Eugène et Coutard Camille Angèle - 16 Avril 98 ». Source : [AD86, TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c). Prouve une présence Audy aux Ormes dès 1898. Ne prouve pas l’achat de la villa ni le lien avec Fabrice Audy.*\r\n\r\nMême décennie, lettre S (naissances / mariages / décès) : **aucun Salis** **[F]** - [même ark](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_naissances_S.jpg).\r\n\r\n### Le notaire Lasserré\r\n\r\nGeorges Victor Lasserré, notaire à Châtellerault, est le fil rouge documentaire de l’époque Salis : c’est chez lui que l’on trouve l’achat de la vigne de 1890 **[F]**, et c’est lui qui apparaît dans les papiers de succession à Naintré **[F]**.\r\n\r\n→ [Répertoire Lasserré en ligne (AD86)](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df)  \r\n→ [Notice inventaire Salis - FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)\r\n\r\nUne partie de ses registres se lit en ligne ; les actes complets (les « minutes ») se consultent sur place aux Archives départementales **[ÀV]** - [portail Archives Deux-Sèvres-Vienne](https://archives-deux-sevres-vienne.fr/).\r\n\r\n---\r\n\r\n## 4. Ce que les archives disent vraiment\r\n\r\n### L’achat du 7 novembre 1890 - vigne à Naintré\r\n\r\nDans le registre du notaire Lasserré, à la date du 7 novembre 1890, on lit une vente à **Rodolphe Salis**, « directeur du Chat Noir » à Paris : une **pièce de terre en vigne**, lieu-dit **les Ormes**, commune de **Naintré**, pour **3 300 francs** **[F]**. Contenance : **1 ha 48 a 4 ca** — sans rapport avec les 366 m² de la villa **[F]**.\r\n\r\n→ [Image du registre - vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37)\r\n\r\n![Extrait du registre notarial, vente de 1890](../09_Sources_Archives/AD_Vienne/LASSERRE_CHATELLERAULT/extraits_visuels/4E46_485_n676_crop.jpg)\r\n\r\n*Vente d’une vigne à Naintré **[F]**. Source en ligne : [AD86, vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). Prouve l’achat de Salis en 1890 - **pas** la propriété de la villa des Ormes.*\r\n\r\nUn inventaire dressé après la mort de Salis confirme les mêmes détails : même lieu-dit, même commune, même surface, même prix **[F]**.\r\n\r\n→ [FranceArchives - dossier d’inventaire](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)\r\n\r\n![Même vente, rappelée dans l’inventaire après décès](../09_Sources_Archives/AD_Vienne/LASSERRE_CHATELLERAULT/extraits_visuels/FRAN_0159_22721_lieudit_prix.jpg)\r\n\r\n*Lieu-dit « les Ormes », commune de Naintré, 1 ha 48 a 4 ca, 3 300 F **[F]**. Extrait local du dossier ; notice : [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Toujours la vigne, jamais la villa.*\r\n\r\nSalis est donc actif dans la région en 1890, chez le même notaire **[F]**. **Cet acte ne titre pas la maison de la rue Pierre-d’Argenson** **[F]**.\r\n\r\n### La Tour de Naintré (1892) et l’inventaire de 1897\r\n\r\nEn août 1892, Salis devient adjudicataire de la Tour de Naintré - cela, les documents le confirment **[F]**. À sa mort en 1897, un inventaire après décès est dressé à Paris **[F]**. La **notice** qui décrit ce dossier ne mentionne pas la commune des Ormes **[F]** — silence de *notice*, pas conclusion sur le contenu des feuillets.\r\n\r\n→ [Notice FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9)  \r\n→ Contexte Tour : [latourdenaintre.fr - Rodolphe Salis](https://latourdenaintre.fr/le-chateau/rodolphe-salis/)\r\n\r\nLe dossier complet (une douzaine de feuillets) n’a pas encore été lu en entier : on ne sait pas si la villa y figure **[H]/[ÀV]**. Ce silence de notice **ne** permet **pas** de dire que la villa est « hors succession ».\r\n\r\n### Des silences qui comptent\r\n\r\nDes publications savantes ou locales sur Salis et Naintré ne parlent pas de la villa des Ormes **[F]**.\r\n\r\n→ [Académie de Touraine - Oberthür (PDF)](http://academie-de-touraine.com/Tome_22_files/138_243-275.pdf)  \r\n→ [latourdenaintre.fr - Salis](https://latourdenaintre.fr/le-chateau/rodolphe-salis/)  \r\n→ Bilan recherches presse / Gallica : fichier local du dossier `09_Sources_Archives/Gallica_BnF/BILAN_RECHERCHE.md` (pas une page d’accueil Gallica).\r\n\r\nAbsence constatée dans *ces* textes et dans le bilan local seulement **[F]** — pas une preuve d’inexistence de la villa ni d’absence de titre Salis.\r\n\r\n### La carte postale vers 1903\r\n\r\nDéjà citée plus haut ; on la rappelle ici comme preuve du *nom* Marie-Louise sur *cette* rue **[F]**.\r\n\r\n→ [Geneanet #7781445](https://en.geneanet.org/postcards/view/7781445)\r\n\r\n![Carte postale Villa Marie-Louise](../08_Iconographie/Cartes_postales/Geneanet_7781445_Villa_Marie-Louise_1903.jpg)\r\n\r\n*Villa Marie-Louise à droite, légende catalogue « vue prise vers 1903 » **[F]**. Source : [Geneanet #7781445](https://en.geneanet.org/postcards/view/7781445). Prouve le *nom* sur *cette* rue. Ne prouve pas Deglane, ni Salis propriétaire, ni Boulanger, ni le calage AB 143 / n°13 **[H]**.*\r\n\r\n---\r\n\r\n## 5. Ce que l’on voit de la maison\r\n\r\n### Le style\r\n\r\nToiture débordante, bois apparent, baies hautes, jeux de brique et de pierre, frises, ferronnerie, vitraux à médaillons : le vocabulaire est celui d’une **villégiature éclectique de la fin du XIXᵉ siècle**, pas celui de l’Art déco géométrique des années 1920 **[H]**. Pour un projet de restauration, on retient donc plutôt « Belle Époque / vers 1890 » comme orientation - en sachant que c’est une lecture raisonnée de l’apparence, pas une date lue sur un permis. Le PLU, lui, dit « art déco » **[F]**.\r\n\r\n→ [PLU Les Ormes](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0)\r\n\r\n### Façade et détails (photos récentes)\r\n\r\n→ [Days on the Claise - Villa Caroline (2021)](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html)\r\n\r\n![Façade sur rue, 2021](../08_Iconographie/Captures_web/2021_DaysOnTheClaise_facade_rue.jpg)\r\n\r\n*Façade vue de la rue en 2021 **[S]**. Source : [daysontheclaise.blogspot.com](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html). Aspect contemporain ; pas une preuve de l’état de 1890.*\r\n\r\n![Monogramme au sol](../08_Iconographie/Captures_web/2026-11-13_blog_monogramme_LR_hires.jpg)\r\n\r\n*Monogramme en carrelage **[S]** (lecture du blog). Source : [même article](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html). Présence du motif claire sur photo récente ; déchiffrement et date d’origine **[H]**.*\r\n\r\n![Portail](../08_Iconographie/Captures_web/2026-11-13_blog_portail_hires.jpg)\r\n\r\n*Portail et ferronnerie, état récent **[S]**. Source : [Days on the Claise](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html). Aspect contemporain ; pas une datation 1890.*\r\n\r\n### Intérieurs (reportage 2020)\r\n\r\n→ [OT Grand Châtellerault, 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)\r\n\r\n![Vitrail Rabelais](../08_Iconographie/Captures_web/2026-11-13_OT_vitraux_rabelais.webp)\r\n\r\n*Vitrail rabelaisien **[S]**. Source : [OT 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/). Sujet clair aujourd’hui ; authenticité d’origine ouverte **[H]/[S]**.*\r\n\r\n![Plafond peint](../08_Iconographie/Captures_web/2026-11-13_OT_plafond_allegorie.webp)\r\n\r\n*Plafond allégorique **[S]**. Source : [OT 2020](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/). État récent ; pas d’attribution ni de date **[H]**.*\r\n\r\n---\r\n\r\n## 6. Où les versions se contredisent - ou semblent se contredire\r\n\r\n**L’architecte.** Trois éléments distincts, de poids inégal : (1) notice AGORHA — Deglane, une villa aux Ormes, 1890 **[F]** - [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf) ; (2) tradition locale — c’est *celle-ci* **[S]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/) / [blog](https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html) ; (3) carte postale — sur *cette* rue, le nom Marie-Louise existe déjà vers 1903 **[F]** - [Geneanet](https://en.geneanet.org/postcards/view/7781445). Ce n’est **pas** une triple corroboration indépendante que Deglane a bâti le n°13 : le premier est un fait de catalogue ; le deuxième un courant narratif unique ; le troisième un nom de maison sur la rue. L’identification avec le n°13 / AB 143 reste **[H]/[ÀV]**.\r\n\r\n**Le propriétaire.** Tradition : Salis **[S]/[H]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/), [France 3](https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html). Acte 1890 : vigne à Naintré **[F]** - [registre AD86](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). Notice d’inventaire 1897 : pas de commune Les Ormes **[F]** (corps non lu = encore **[H]/[ÀV]**) - [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Tables décennales Ormes **1883-1892** et **1893-1902** : **aucun Salis** ; naissance **Salsier Louis**, 1er avril 1891 **[F]** - [TD 1883-92](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [extrait](../08_Iconographie/Arch
