de d’époque, pas pour tout ce qu’on pourrait en déduire<\/td>\n<\/tr>\n<tr>\n<td><strong>[F] doc<\/strong><\/td>\n<td>Le document dit bien cela - ce qu’il affirme peut rester discutable<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Après chaque source : <strong>lien cliquable<\/strong>, citation courte, et <strong>image<\/strong> quand elle existe.<\/p>\n<hr />\n<h2>1. La question que l’on se pose<\/h2>\n<p>Qui a fait bâtir la maison du 13 rue Pierre-d’Argenson ? Pour qui ? Et sous quel titre de propriété ?<\/p>\n<p>La tradition locale répond : Deglane architecte, Salis commanditaire, Marie-Louise dédicataire, famille Audy au XXᵉ siècle <strong>[S]<\/strong>.<\/p>\n<p>Le 7 novembre 1890, Rodolphe Salis achète une pièce de terre en vigne au lieu-dit « les Ormes », dans la <strong>commune de Naintré<\/strong>. Ce n’est <strong>pas<\/strong> la commune des Ormes. Ce n’est <strong>pas<\/strong> la villa <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">Archives Deux-Sèvres-Vienne - répertoire Lasserré, vue 37<\/a><\/p>\n<hr />\n<h2>2. La maison et son quartier<\/h2>\n<h3>Face au domaine d’Argenson<\/h3>\n<p>Les Ormes ont une longue histoire seigneuriale : domaine attesté dès la fin du XIVᵉ siècle, passage aux Argenson en 1729, grandes écuries du XVIIIᵉ, reconstruction du logis au tournant du XXᵉ <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://pop.culture.gouv.fr/notice/merimee/IA86000547\">POP - notice château / domaine IA86000547<\/a><\/p>\n<p>La villa s’installe dans ce paysage de bourg recomposé, côté est du parc, sur une lanière entre la rue et le jardin. L’office de tourisme relie la maison au château voisin, notamment via le vitrail rabelaisien de la salle à manger <strong>[S]<\/strong>.<\/p>\n<p>→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT Grand Châtellerault, 8 sept. 2020<\/a><\/p>\n<p><em>Vitrail de la salle à manger (reportage OT 2020) <strong>[S]<\/strong>. Source : <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">tourisme-chatellerault.fr<\/a>. État récent ; origine 1890 non prouvée <strong>[H]<\/strong>.<\/em><\/p>\n<h3>La parcelle<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adresse<\/td>\n<td>13 rue Pierre-d’Argenson, 86220 Les Ormes<\/td>\n<td><strong>[F]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Parcelle<\/td>\n<td>AB 143 (référence nationale 86183000AB0143)<\/td>\n<td><strong>[F]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Surface<\/td>\n<td>366 m²<\/td>\n<td><strong>[F]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Emplacement<\/td>\n<td>environ 46,975° N / 0,603° E<\/td>\n<td><strong>[F]<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>→ <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">Carte cadastrale interactive - AB 143<\/a><\/p>\n<p>La parcelle voisine au sud (AB 144, 144 m²) prolonge le jardin : quand on imagine « la villa et son jardin », on ne regarde pas seulement les 366 m² <strong>[F]<\/strong>.<\/p>\n<p><em>Parcelle AB 143 <strong>[F]<\/strong>. Source : <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">cadastre.data.gouv.fr<\/a>. Fixe l’adresse et l’emprise actuelle - pas le propriétaire historique ni la date de construction.<\/em><\/p>\n<h3>Ce que disent les règles d’urbanisme<\/h3>\n<p>Le plan local d’urbanisme (approuvé en 2018) range la maison parmi le patrimoine bâti <strong>non classé<\/strong> monument historique, avec la mention « villa de style art déco » <strong>[F] doc<\/strong>.<\/p>\n<p>→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">Document PLU - Géoportail de l’urbanisme<\/a><br />\n→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/api/document/567b5bf6a339134f0bc34c21786068d0/files/86183_rapport_20180910.pdf\">Rapport de présentation (PDF)<\/a><\/p>\n<p>Mention présente dans le document officiel. Style observé : villégiature Belle Époque / fin XIXᵉ plutôt qu’Art déco des années 1920 <strong>[H]<\/strong> - hypothèse de travail, pas datation prouvée.<\/p>\n<p>La rue relève <strong>très probablement<\/strong> du centre-bourg (zone dite « UA »), où l’aspect architectural compte <strong>[H]/[ÀV]<\/strong> - à confirmer sur le <a href=\"https://www.geoportail-urbanisme.gouv.fr/map/?documentId=567b5bf6a339134f0bc34c21786068d0#tile=1&amp;lon=0.603394&amp;lat=46.975082&amp;zoom=18\">règlement graphique GPU<\/a>. La maison se trouve aussi dans le <strong>périmètre de 500 mètres<\/strong> autour des monuments protégés du château : tout travaux sensibles y demandent l’accord préalable des abords <strong>[F]<\/strong>. Elle n’est en revanche <strong>pas<\/strong> elle-même sur la liste du classement du domaine <strong>[F]<\/strong> - <a href=\"https://www.pop.culture.gouv.fr/notice/merimee/PA00105572\">base POP / Mérimée PA00105572<\/a> (contexte château).<\/p>\n<h3>Ce que montrent les photos aériennes<\/h3>\n<p>Dès les années 1950-1965, le volume principal est déjà là <strong>[F]<\/strong>. Il n’y a pas encore de piscine <strong>[F]<\/strong>. Entre 2000 et 2005, une piscine rectangulaire apparaît dans le jardin ; elle reste ensuite <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN - Remonter le temps (comparer)<\/a><\/p>\n<p><em>Ortho 1950-1960 <strong>[F]<\/strong>. Source : <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN Remonter le temps<\/a>. Maison présente ; pas de piscine. Ne prouve ni 1890 ni Deglane.<\/em><\/p>\n<p><em>Ortho 2000-2005 <strong>[F]<\/strong>. Source : <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">même comparateur IGN<\/a>. Piscine visible ; année exacte du creusement <strong>[H]<\/strong>.<\/em><\/p>\n<p>Volume principal conservé dans ses grandes lignes depuis le milieu du XXᵉ <strong>[F]<\/strong> ; piscine = ajout, visible au début du XXIᵉ <strong>[F]<\/strong>. Attribution du creusement à la famille Audy : tradition locale <strong>[S]<\/strong> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a>.<\/p>\n<hr />\n<h2>3. Les personnes du récit<\/h2>\n<h3>Henri Deglane (1855-1931), l’architecte<\/h3>\n<p>Prix de Rome, puis l’un des architectes du Grand Palais à Paris. Dans la notice de référence qui lui est consacrée (base AGORHA, Institut national d’histoire de l’art), on lit qu’il a réalisé des constructions particulières, « <strong>dont une villa aux Ormes (Vienne) en 1890<\/strong> » <strong>[F]<\/strong>.<\/p>\n<blockquote>\n<p>« …constructions particulières dont une villa aux Ormes (Vienne) en 1890… »<\/p>\n<\/blockquote>\n<p>→ <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA - notice Deglane (ark INHA)<\/a><\/p>\n<p><em>Henri Deglane (portrait ≤1905) <strong>[F]<\/strong> illustratif. Source : <a href=\"https://commons.wikimedia.org/wiki/File:Henri_Deglane.jpg\">Wikimedia Commons<\/a> (fichier local du dossier). Identité de l’architecte ; pas le lien avec AB 143.<\/em><\/p>\n<p>Deglane a donc une villa aux Ormes, en 1890, dans son catalogue <strong>[F]<\/strong>. Que ce soit le numéro 13 de la rue Pierre-d’Argenson n’est pas établi : la <a href=\"https://en.geneanet.org/postcards/view/7781445\">carte postale Marie-Louise<\/a> sur cette rue renforce l’hypothèse, sans plan, permis ni matrice pour la sceller <strong>[H]/[ÀV]<\/strong>.<\/p>\n<p>La tradition locale attribue la maison à Deglane à cette adresse <strong>[S]<\/strong> :<\/p>\n<p>→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">Office de tourisme, 2020<\/a><br />\n→ <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise, févr. 2021<\/a><\/p>\n<p>OT, blog et presse reprennent en pratique <strong>un même courant<\/strong> narratif, pas trois preuves indépendantes.<\/p>\n<h3>Rodolphe Salis (1851-1897) et le Chat Noir<\/h3>\n<p>Châtelleraudais, fondateur du Chat Noir à Paris, époux de Marie Gabrielle Thiennet, acquéreur de la Tour de Naintré en 1892 <strong>[F]<\/strong>, mort à Naintré en 1897 <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives - inventaire après décès / notice succession<\/a><\/p>\n<p>Autour des Ormes, on raconte qu’il aurait fait bâtir la villa pour une « Marie-Louise » <strong>[S]<\/strong>. L’office de tourisme, un reportage France 3 et un blog anglais reprennent cette version. En pratique, c’est <strong>un même courant de tradition locale<\/strong>, pas trois sources indépendantes.<\/p>\n<p>→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a><br />\n→ <a href=\"https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html\">France 3 - Itinéraire bis aux Ormes<\/a><br />\n→ <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise<\/a><\/p>\n<p>Aucun acte consulté jusqu’ici ne montre Salis propriétaire de la parcelle de la villa. L’acte de 1890 que l’on tient vraiment - et que l’on peut lire - concerne une vigne à Naintré <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">vue 37 du registre<\/a>. Salis est donc un personnage <strong>documenté<\/strong> dans la région <strong>[F]<\/strong> ; son rôle de maître d’ouvrage de <em>cette<\/em> maison reste, pour l’instant, une tradition <strong>[S]/[H]<\/strong>.<\/p>\n<p>Dans l’état civil <em>de la commune des Ormes<\/em> pour 1883-1892, le nom <strong>Salis<\/strong> n’apparaît ni aux naissances, ni aux mariages, ni aux décès <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">Tables décennales Les Ormes 1883-1892 (AD86)<\/a><\/p>\n<p>Sous la lettre S des naissances figure <strong>Salsier Louis<\/strong>, 1er avril 1891 <strong>[F]<\/strong> :<\/p>\n<p><em>Extrait de la table décennale des naissances, lettre S <strong>[F]<\/strong>. Source : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">AD86, tables 1883-1892<\/a>. Prouve un <strong>Salsier<\/strong> aux Ormes en 1891. Ne prouve pas un Salis habitant ou propriétaire de la villa.<\/em><\/p>\n<p>Sur le recensement de 1891 du bourg (Place de la Halle, Grande Rue), <strong>aucun Salis<\/strong> <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">recensement 1891<\/a>. À la Place de la Halle : <strong>René d’Argenson<\/strong>, propriétaire, avec deux enfants et du personnel <strong>[F]<\/strong> :<\/p>\n<p><em>Liste nominative 1891, « La Halle » <strong>[F]<\/strong>. Source : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">AD86, recensement Les Ormes 1891<\/a>. Prouve la présence d’Argenson au bourg en 1891. Ne dit rien de Salis ni de la villa Marie-Louise.<\/em><\/p>\n<p><em>Rodolphe Salis <strong>[F]<\/strong> illustratif. Fichier local du dossier (Wikimedia). Identité connue ; propriété de la villa <strong>[S]/[H]<\/strong> ; absence dans l’état civil Ormes 1883-92 <strong>[F]<\/strong>.<\/em><\/p>\n<h3>Marie-Louise - un prénom de maison, pas un état civil<\/h3>\n<p>Vers 1903, une carte postale de la rue Pierre-d’Argenson montre « la Villa Marie-Louise à droite » <strong>[F] icono<\/strong>.<\/p>\n<p>→ <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet - carte postale #7781445<\/a><\/p>\n<p><em>Villa Marie-Louise à droite <strong>[F] icono<\/strong>. <a href=\"https://en.geneanet.org/postcards/view/7781445\">Source Geneanet<\/a>.<\/em><\/p>\n<p>Le prénom (ou le nom de maison) est donc ancien et bien attaché à <em>cette<\/em> rue. En revanche, le nom de famille <strong>Boulanger<\/strong>, parfois ajouté sur Internet, ne repose pour l’instant que sur une modification Wikipédia de 2025, anonyme et sans source <strong>[S]<\/strong>.<\/p>\n<p>→ <a href=\"https://fr.wikipedia.org/wiki/Les_Ormes_(Vienne)\">Wikipédia - Les Ormes (Vienne)<\/a><\/p>\n<p>Un reportage télé parle d’une « maîtresse » sans donner ce nom <strong>[S]<\/strong> - <a href=\"https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html\">France 3<\/a>. On garde le prénom ; on laisse le patronyme de côté jusqu’à une preuve d’état civil <strong>[ÀV]<\/strong>.<\/p>\n<h3>La famille Audy et le nom Caroline<\/h3>\n<p>Selon l’office de tourisme (2020), Fabrice Audy présente une maison « dans sa famille depuis 70 ans », rebaptisée Villa Caroline en hommage à sa mère, Caroline Waldé <strong>[S]<\/strong>.<\/p>\n<p>→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT - « Les Ormes, la surprise du chef »<\/a><\/p>\n<p>Si l’on fait le calcul, on arrive vers 1950 - mais c’est une estimation à partir d’un témoignage, pas une date lue sur un acte <strong>[S]/[ÀV]<\/strong>. Un annuaire contemporain place bien <strong>Fabrice Audy<\/strong> au <strong>13 rue Pierre-d’Argenson<\/strong>, 86220 Les Ormes <strong>[F] data<\/strong>.<\/p>\n<p>→ <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">Annuaire - Audy Fabrice, Les Ormes<\/a><\/p>\n<p>D’autres archives (liées au peintre Tang Haywen) croisent les noms Audy / Caroline / Fabrice et parlent d’une « Villa Caroline », avec une géographie un peu floue (« Loire ») <strong>[H]/[ÀV]<\/strong>.<\/p>\n<p>→ <a href=\"https://www.tanghaywenarchives.com/fr/friends/raymond-audy\">Tang Haywen Archives - Raymond Audy<\/a><\/p>\n<p>Noms convergents pour le XXᵉ siècle ; date d’acquisition et chaîne cadastrale <strong>[ÀV]<\/strong>.<\/p>\n<p>Sur le recensement 1891 du bourg : <strong>aucun Audy<\/strong> <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC 1891<\/a>. La table décennale <strong>1893-1902<\/strong> enregistre un mariage <strong>Audy<\/strong> aux Ormes le <strong>16 avril 1898<\/strong> :<\/p>\n<p>→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">Tables décennales Les Ormes 1893-1902 (AD86)<\/a><\/p>\n<p><em>Ligne de la table décennale des mariages <strong>[F]<\/strong> : « Audy Ludger Eugène et Coutard Camille Angèle - 16 Avril 98 ». Source : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">AD86, TD 1893-1902<\/a>. Prouve une présence Audy aux Ormes dès 1898. Ne prouve pas l’achat de la villa ni le lien avec Fabrice Audy.<\/em><\/p>\n<p>Même décennie, lettre S (naissances / mariages / décès) : <strong>aucun Salis<\/strong> <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">même ark<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1893-1902_naissances_S.jpg\">extrait<\/a>.<\/p>\n<h3>Le notaire Lasserré<\/h3>\n<p>Georges Victor Lasserré, notaire à Châtellerault, est le fil rouge documentaire de l’époque Salis : c’est chez lui que l’on trouve l’achat de la vigne de 1890 <strong>[F]<\/strong>, et c’est lui qui apparaît dans les papiers de succession à Naintré <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df\">Répertoire Lasserré en ligne (AD86)<\/a><br />\n→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">Notice inventaire Salis - FranceArchives<\/a><\/p>\n<p>Une partie de ses registres se lit en ligne ; les actes complets (les « minutes ») se consultent sur place aux Archives départementales <strong>[ÀV]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/\">portail Archives Deux-Sèvres-Vienne<\/a>.<\/p>\n<hr />\n<h2>4. Ce que les archives disent vraiment<\/h2>\n<h3>L’achat du 7 novembre 1890 - vigne à Naintré<\/h3>\n<p>Dans le registre du notaire Lasserré, à la date du 7 novembre 1890, on lit une vente à <strong>Rodolphe Salis<\/strong>, « directeur du Chat Noir » à Paris : une <strong>pièce de terre en vigne<\/strong>, lieu-dit <strong>les Ormes<\/strong>, commune de <strong>Naintré<\/strong>, pour <strong>3 300 francs<\/strong> <strong>[F]<\/strong>. La surface est d’environ <strong>un hectare et demi<\/strong> - bien plus grande que la parcelle actuelle de la villa (366 m²) <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">Image du registre - vue 37<\/a><\/p>\n<p><em>Vente d’une vigne à Naintré <strong>[F]<\/strong>. Source en ligne : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">AD86, vue 37<\/a>. Prouve l’achat de Salis en 1890 - <strong>pas<\/strong> la propriété de la villa des Ormes.<\/em><\/p>\n<p>Un inventaire dressé après la mort de Salis confirme les mêmes détails : même lieu-dit, même commune, même surface, même prix <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives - dossier d’inventaire<\/a><\/p>\n<p><em>Lieu-dit « les Ormes », commune de Naintré, ~1,5 ha, 3 300 F <strong>[F]<\/strong>. Extrait local du dossier ; notice : <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a>. Toujours la vigne, jamais la villa.<\/em><\/p>\n<p>Salis est donc actif dans la région en 1890, chez le même notaire <strong>[F]<\/strong>. <strong>Cet acte ne titre pas la maison de la rue Pierre-d’Argenson<\/strong> <strong>[F]<\/strong>.<\/p>\n<h3>La Tour de Naintré (1892) et l’inventaire de 1897<\/h3>\n<p>En août 1892, Salis devient adjudicataire de la Tour de Naintré - cela, les documents le confirment <strong>[F]<\/strong>. À sa mort en 1897, un inventaire après décès est dressé à Paris <strong>[F]<\/strong>. La <strong>notice<\/strong> qui décrit ce dossier ne mentionne pas la commune des Ormes <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">Notice FranceArchives<\/a><br />\n→ Contexte Tour : <a href=\"https://latourdenaintre.fr/le-chateau/rodolphe-salis/\">latourdenaintre.fr - Rodolphe Salis<\/a><\/p>\n<p>Le dossier complet (une douzaine de feuillets) n’a pas encore été lu en entier : on ne sait pas si la villa y figure <strong>[H]/[ÀV]<\/strong>.<\/p>\n<h3>Des silences qui comptent - sans trop en faire<\/h3>\n<p>Des publications savantes ou locales sur Salis et Naintré ne parlent pas de la villa des Ormes <strong>[F]<\/strong>.<\/p>\n<p>→ <a href=\"http://academie-de-touraine.com/Tome_22_files/138_243-275.pdf\">Académie de Touraine - Oberthür (PDF)<\/a><br />\n→ <a href=\"https://latourdenaintre.fr/le-chateau/rodolphe-salis/\">latourdenaintre.fr - Salis<\/a><br />\n→ <a href=\"https://gallica.bnf.fr/\">Gallica<\/a> (recherches ciblées du dossier)<\/p>\n<p>Absence constatée dans <em>ces<\/em> publications seulement <strong>[F]<\/strong> - pas une preuve d’inexistence de la villa ni d’absence de titre Salis.<\/p>\n<h3>La carte postale vers 1903<\/h3>\n<p>Déjà citée plus haut ; on la rappelle ici comme preuve du <em>nom<\/em> Marie-Louise sur <em>cette<\/em> rue <strong>[F] icono<\/strong>.<\/p>\n<p>→ <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet #7781445<\/a><\/p>\n<p><em>Ne dit rien de Deglane, ni de Salis propriétaire, ni d’un nom de famille Boulanger.<\/em><\/p>\n<hr />\n<h2>5. Ce que l’on voit de la maison<\/h2>\n<h3>Le style<\/h3>\n<p>Toiture débordante, bois apparent, baies hautes, jeux de brique et de pierre, frises, ferronnerie, vitraux à médaillons : le vocabulaire est celui d’une <strong>villégiature éclectique de la fin du XIXᵉ siècle<\/strong>, pas celui de l’Art déco géométrique des années 1920 <strong>[H]<\/strong>. Pour un projet de restauration, on retient donc plutôt « Belle Époque / vers 1890 » comme orientation - en sachant que c’est une lecture raisonnée de l’apparence, pas une date lue sur un permis. Le PLU, lui, dit « art déco » <strong>[F] doc<\/strong>.<\/p>\n<p>→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">PLU Les Ormes<\/a><\/p>\n<h3>Façade et détails (photos récentes)<\/h3>\n<p>→ <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise - Villa Caroline (2021)<\/a><\/p>\n<p><em>Façade vue de la rue en 2021 <strong>[S]<\/strong>. Source : <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">daysontheclaise.blogspot.com<\/a>. Aspect contemporain ; pas une preuve de l’état de 1890.<\/em><\/p>\n<p><em>Monogramme en carrelage <strong>[S]<\/strong> (lecture du blog). Source : <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">même article<\/a>. Présence du motif claire sur photo récente ; déchiffrement et date d’origine <strong>[H]<\/strong>.<\/em><\/p>\n<p><em>Portail et ferronnerie, état récent <strong>[S]<\/strong>. Source : <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise<\/a>.<\/em><\/p>\n<h3>Intérieurs (reportage 2020)<\/h3>\n<p>→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT Grand Châtellerault, 2020<\/a><\/p>\n<p><em>Vitrail rabelaisien <strong>[S]<\/strong>. Source : <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a>. Sujet clair aujourd’hui ; authenticité d’origine ouverte <strong>[H]/[S]<\/strong>.<\/em><\/p>\n<p><em>Plafond allégorique <strong>[S]<\/strong>. Source : <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a>. État récent ; pas d’attribution ni de date <strong>[H]<\/strong>.<\/em><\/p>\n<hr />\n<h2>6. Où les versions se contredisent - ou semblent se contredire<\/h2>\n<p><strong>L’architecte.<\/strong> Une notice sérieuse dit : Deglane, une villa aux Ormes, 1890 <strong>[F]<\/strong> - <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a>. La tradition locale dit : c’est <em>celle-ci<\/em> <strong>[S]<\/strong> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a> / <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">blog<\/a>. La carte postale dit : sur <em>cette<\/em> rue, le nom Marie-Louise existe déjà vers 1903 <strong>[F] icono<\/strong> - <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet<\/a>. Les trois indices vont dans le même sens, mais ils ne se valent pas : le premier est un fait de catalogue ; l’identification avec le n°13 reste <strong>[H]/[ÀV]<\/strong>.<\/p>\n<p><strong>Le propriétaire.<\/strong> Tradition : Salis <strong>[S]/[H]<\/strong> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>, <a href=\"https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html\">France 3<\/a>. Acte 1890 : vigne à Naintré <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">registre AD86<\/a>. Notice d’inventaire 1897 : pas de commune Les Ormes <strong>[F]<\/strong> - <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a>. Tables décennales Ormes <strong>1883-1892<\/strong> et <strong>1893-1902<\/strong> : <strong>aucun Salis<\/strong> ; naissance <strong>Salsier Louis<\/strong>, 1er avril 1891 <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD 1883-92<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg\">extrait<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a>. Recensement 1891 : pas de Salis ; <strong>René d’Argenson<\/strong> à la Place de la Halle <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC 1891<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg\">extrait<\/a>. Pas de titre de propriété établi pour la villa.<\/p>\n<p><strong>Les noms de lieux.<\/strong> « Les Ormes » = commune <strong>ou<\/strong> lieu-dit à Naintré <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">vue 37<\/a>.<\/p>\n<p><strong>Le style.<\/strong> Le PLU écrit « art déco » <strong>[F] doc<\/strong> - <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">GPU<\/a>. L’œil et la fenêtre 1890 disent plutôt Belle Époque <strong>[H]<\/strong>. On suit le second pour un projet, en notant que le premier est une erreur probable de libellé.<\/p>\n<p><strong>Boulanger / Audy.<\/strong> Boulanger trop fragile pour le récit factuel <strong>[S]<\/strong> - <a href=\"https://fr.wikipedia.org/wiki/Les_Ormes_(Vienne)\">Wikipédia<\/a> (sans source). Audy : mariage <strong>Ludger × Coutard<\/strong>, 16 avril 1898, aux Ormes <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg\">extrait<\/a> ; Fabrice au n°13 <strong>[F] data<\/strong> - <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a> ; acquisition de la villa encore <strong>[S]/[ÀV]<\/strong> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>.<\/p>\n<hr />\n<h2>7. Ce qu’il reste à vérifier <strong>[ÀV]<\/strong><\/h2>\n<p>Pour transformer les plus belles hypothèses en faits, il faudrait notamment :<\/p>\n<ol>\n<li><strong>Les registres du cadastre<\/strong> (matrices) pour la parcelle AB 143 - <a href=\"https://archives-deux-sevres-vienne.fr/\">portail AD86<\/a> ; repère parcelle : <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">cadastre AB 143<\/a>.<\/li>\n<li><strong>L’acte complet<\/strong> de la vente de 1890 chez le notaire (pas seulement le résumé du registre) - point de départ : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">vue 37<\/a>.<\/li>\n<li><strong>Le dossier d’inventaire après décès<\/strong> de Salis, feuillets complets - <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a>.<\/li>\n<li><strong>Les études des notaires<\/strong> de la commune des Ormes - <a href=\"https://archives-deux-sevres-vienne.fr/\">AD86<\/a>.<\/li>\n<li><strong>Plans Deglane pour la villa<\/strong> - la cote AN <strong>AJ/52/361<\/strong> citée par <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a> est un <strong>dossier d’élève<\/strong> (lettres, notes), <strong>pas<\/strong> un fonds de plans de la villa <strong>[F]<\/strong> (2026-11-17). Chercher ailleurs (permis, autres fonds).<\/li>\n<li><strong>L’état civil<\/strong> de la Marie-Louise du début du XXᵉ siècle - avant toute affirmation de nom de famille. <em>(TD Ormes 1883-1902 : pas de Salis ; pas de Boulanger - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD 1883-92<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a>.)<\/em><\/li>\n<li><strong>L’acte d’acquisition<\/strong> de la famille Audy (titre / matrices) - pour sortir de l’estimation « depuis 70 ans » (<a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>). <em>Déjà [F] : Fabrice Audy au n°13 (<a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a>) ; mariage <strong>Audy Ludger Eugène × Coutard Camille Angèle<\/strong>, 16 avril 1898, aux Ormes (<a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg\">extrait<\/a>) - présence Audy locale dès 1898, <strong>sans<\/strong> preuve que ce soit l’achat de la villa.<\/em><\/li>\n<li><strong>Recensements 1901 / 1906<\/strong> - Audy / Salis / adresse rue Pierre-d’Argenson (REC 1891 : pas de Salis sur le bourg consulté - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC<\/a> ; TD 1893-1902 : Audy 1898, pas de Salis).<\/li>\n<li><strong>État civil Naintré<\/strong> - acte de décès Salis 20/03/1897 (commune déjà [F] notices) + TD Naintré 1893-1902 si disponible - <a href=\"https://archives-deux-sevres-vienne.fr/\">AD86<\/a>.<\/li>\n<\/ol>\n<hr />\n<h2>8. Conclusion<\/h2>\n<p>La Villa Caroline est adressée, cadastrée, photographiée, située dans les abords du château <strong>[F]<\/strong> - <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">cadastre<\/a>, <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN<\/a>, <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">PLU<\/a>. Ancien nom Marie-Louise : carte postale du début du XXᵉ siècle <strong>[F] icono<\/strong> - <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet<\/a>. Notice AGORHA : villa aux Ormes par Deglane en 1890 <strong>[F]<\/strong> - <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a> ; identification avec le n°13 <strong>[H]/[ÀV]<\/strong>. Salis documenté dans la région <strong>[F]<\/strong> ; propriétaire de <em>cette<\/em> maison : tradition locale seulement <strong>[S]/[H]<\/strong> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>. Acte 1890 solide le concernant ici : vigne à Naintré <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">registre AD86<\/a>. État civil Ormes <strong>1883-1902<\/strong> : <strong>pas de Salis<\/strong> <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD 1883-92<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a> ; mariage <strong>Audy × Coutard<\/strong> 16 avril 1898 <strong>[F]<\/strong> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg\">extrait<\/a>. Fabrice Audy au n°13 aujourd’hui <strong>[F] data<\/strong> - <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a> ; acquisition de <em>cette<\/em> maison ~1950 encore <strong>[S]/[ÀV]<\/strong>.<\/p>\n<p>Pour un projet : orientation Belle Époque / fin XIXᵉ <strong>[H]<\/strong> ; abords MH <strong>[F]<\/strong> ; centre-bourg probable <strong>[H]/[ÀV]<\/strong> ; tradition Chat Noir / Deglane / Marie-Louise <strong>[S]<\/strong> (pas un titre) ; monogramme, vitraux et plafond à documenter sans datation d’autorité <strong>[H]/[S]<\/strong> ; volume ancien vs ajouts (piscine <strong>[F]<\/strong> ; Audy local dès 1898 <strong>[F]<\/strong> + domicile contemporain <strong>[F] data<\/strong> ; titre villa Audy <strong>[S]/[ÀV]<\/strong>).<\/p>\n<p>Prochaines pièces utiles : matrices cadastrales, minute notariale de 1890, folios de l’inventaire 1897, REC 1901/1906, acte de mariage Audy 1898, acte d’acquisition villa.<\/p>\n<hr />\n<h2>Annexe - Chronologie en un coup d’œil<\/h2>\n<table>\n<thead>\n<tr>\n<th>Quand<\/th>\n<th>Quoi<\/th>\n<th>Tag<\/th>\n<th>Lien<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vers 1890<\/td>\n<td>Notice : Deglane a « une villa aux Ormes »<\/td>\n<td><strong>[F]<\/strong> notice · ID maison = <strong>[H]/[ÀV]<\/strong><\/td>\n<td><a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a><\/td>\n<\/tr>\n<tr>\n<td>7 nov. 1890<\/td>\n<td>Salis achète une vigne « les Ormes », cne Naintré<\/td>\n<td><strong>[F]<\/strong> - pas la villa<\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">AD86 vue 37<\/a><\/td>\n<\/tr>\n<tr>\n<td>1er avril 1891<\/td>\n<td>Naissance <strong>Salsier<\/strong> Louis<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg\">extrait<\/a><\/td>\n<\/tr>\n<tr>\n<td>1891<\/td>\n<td>REC : René d’Argenson, Place de la Halle ; pas de Salis au bourg<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg\">extrait<\/a><\/td>\n<\/tr>\n<tr>\n<td>1883-1892<\/td>\n<td>TD Ormes : <strong>aucun Salis<\/strong> (N/M/D)<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD<\/a><\/td>\n<\/tr>\n<tr>\n<td>16 avril 1898<\/td>\n<td>Mariage <strong>Audy<\/strong> Ludger × <strong>Coutard<\/strong> Camille (Ormes)<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a> · <a href=\"../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg\">extrait<\/a><\/td>\n<\/tr>\n<tr>\n<td>1893-1902<\/td>\n<td>TD Ormes : <strong>aucun Salis<\/strong> ; pas de Boulanger<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD<\/a><\/td>\n<\/tr>\n<tr>\n<td>Tradition locale<\/td>\n<td>Salis commanditaire pour Marie-Louise<\/td>\n<td><strong>[S]/[H]<\/strong><\/td>\n<td><a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a><\/td>\n<\/tr>\n<tr>\n<td>17 août 1892<\/td>\n<td>Salis acquiert la Tour de Naintré<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a><\/td>\n<\/tr>\n<tr>\n<td>20 mars 1897<\/td>\n<td>Mort de Salis ; inventaire<\/td>\n<td><strong>[F]<\/strong> · villa Ormes non lue = <strong>[H]/[ÀV]<\/strong><\/td>\n<td><a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vers 1903<\/td>\n<td>CP Villa Marie-Louise<\/td>\n<td><strong>[F] icono<\/strong><\/td>\n<td><a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vers 1950 ?<\/td>\n<td>Famille Audy ; nom Caroline<\/td>\n<td><strong>[S]/[ÀV]<\/strong><\/td>\n<td><a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a><\/td>\n<\/tr>\n<tr>\n<td>Début années 2000<\/td>\n<td>Piscine visible<\/td>\n<td><strong>[F]<\/strong><\/td>\n<td><a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN<\/a><\/td>\n<\/tr>\n<tr>\n<td>Contemporain<\/td>\n<td>Fabrice Audy @ 13 rue P.-d’Argenson<\/td>\n<td><strong>[F] data<\/strong><\/td>\n<td><a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025<\/td>\n<td>Wiki « Boulanger »<\/td>\n<td><strong>[S]<\/strong><\/td>\n<td><a href=\"https://fr.wikipedia.org/wiki/Les_Ormes_(Vienne)\">Wikipédia<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Annexe - Petit glossaire<\/h2>\n<p><em>AGORHA<\/em> : base biographique d’architectes (INHA). <em>Matrices<\/em> : registres du cadastre qui suivent les propriétaires dans le temps. <em>Répertoire / minute<\/em> : le répertoire est l’index du notaire ; la minute est l’acte complet. <em>Inventaire après décès<\/em> : liste des biens dressée après une mort, pour la succession. <em>Abords MH<\/em> : zone de 500 m autour d’un monument historique, où les travaux sont encadrés.<\/p>\n<hr />\n<p><em>Texte destiné à un lecteur particulier. Tags <strong>[F] / [S] / [H] / [ÀV]<\/strong> + lien (et image) après chaque source. Ne remplace pas un acte notarié, un permis, ni une consultation en archives.<\/em><\/p>"}</script>

  const openDb = () =>
    new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "id" }).createIndex("createdAt", "createdAt");
        }
        if (!db.objectStoreNames.contains(META)) {
          db.createObjectStore(META, { keyPath: "key" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

  const idbGetAll = async () => {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const r = tx.objectStore(STORE).getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
  };

  const idbPut = async (track) => {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(track);
      tx.oncomplete = () => resolve(track);
      tx.onerror = () => reject(tx.error);
    });
  };

  const idbMetaGet = async (key) => {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const r = db.transaction(META, "readonly").objectStore(META).get(key);
      r.onsuccess = () => resolve(r.result?.value);
      r.onerror = () => reject(r.error);
    });
  };

  const idbMetaSet = async (key, value) => {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(META, "readwrite");
      tx.objectStore(META).put({ key, value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  };

  const esc = (s) =>
    String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

  const norm = (t) =>
    String(t || "")
      .replace(/\u00a0/g, " ")
      .replace(/\s+/g, " ")
      .trim();

  const lcsOps = (a, b) => {
    const n = a.length;
    const m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const ops = [];
    let i = 0;
    let j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) {
        ops.push({ op: "eq", ai: i, bi: j, text: a[i] });
        i++;
        j++;
      } else if (dp[i + 1][j] >= dp[i][j + 1]) {
        ops.push({ op: "del", ai: i, text: a[i++] });
      } else {
        ops.push({ op: "ins", bi: j, text: b[j++] });
      }
    }
    while (i < n) ops.push({ op: "del", ai: i, text: a[i++] });
    while (j < m) ops.push({ op: "ins", bi: j, text: b[j++] });
    return ops;
  };

  const splitSentences = (text) => {
    const t = String(text || "").trim();
    if (!t) return [];
    // Keep separators attached to previous sentence
    const parts = t.split(/(?<=[.!?…])\s+(?=[A-ZÀÂÄÉÈÊËÏÎÔÙÛÜÇ«"0-9])/);
    return parts.map((p) => p.trim()).filter(Boolean);
  };

  /**
   * One paragraph only (the new text). Unchanged sentences: light tint.
   * New/changed sentences: stronger green. Dropped sentences: one compact red line above.
   */
  const sentenceDiffHtml = (oldText, newText) => {
    const a = splitSentences(oldText);
    const b = splitSentences(newText);
    if (!b.length) {
      return `<span class="hist-sent hist-sent-del">${esc(oldText)}</span>`;
    }
    if (!a.length) {
      return `<span class="hist-sent hist-sent-ins">${esc(newText)}</span>`;
    }
    const ops = lcsOps(a, b);
    const removed = [];
    const body = [];
    for (let i = 0; i < ops.length; i++) {
      const op = ops[i];
      const next = ops[i + 1];
      if (op.op === "eq") {
        body.push(`<span class="hist-sent hist-sent-same">${esc(op.text)}</span> `);
      } else if (op.op === "del" && next && next.op === "ins") {
        // Replaced sentence → show only the new one (green), skip duplicating old
        body.push(`<span class="hist-sent hist-sent-ins">${esc(next.text)}</span> `);
        i++;
      } else if (op.op === "del") {
        removed.push(op.text);
      } else {
        body.push(`<span class="hist-sent hist-sent-ins">${esc(op.text)}</span> `);
      }
    }
    let html = body.join("").trim();
    if (removed.length) {
      html =
        `<span class="hist-sent hist-sent-del hist-sent-removed">${esc(removed.join(" "))}</span> ` +
        html;
    }
    return html;
  };

  const wrapBlock = (el, kind, innerHtml) => {
    const tag = (el?.tagName || "P").toLowerCase();
    const cls = ["hist-block", `hist-block-${kind}`];
    if (el?.className) cls.push(el.className);
    return `<${tag} class="${esc(cls.join(" "))}">${innerHtml}</${tag}>`;
  };

  const cloneKeep = (el) => el.outerHTML;

  /**
   * Formatted article: unchanged blocks keep site HTML;
   * changed paragraphs get soft full-block wash (+ sentence wash inside replaces).
   */
  const proseDiffHtml = (beforeHtml, afterHtml) => {
    const parse = (html) => {
      const d = document.createElement("div");
      d.innerHTML = html || "";
      return [...d.children];
    };
    const before = parse(beforeHtml);
    const after = parse(afterHtml);
    if (!before.length && after.length) return afterHtml || "";
    if (before.length && !after.length) {
      return before.map((el) => wrapBlock(el, "del", el.innerHTML)).join("\n");
    }

    const aKeys = before.map((el) => norm(el.innerText));
    const bKeys = after.map((el) => norm(el.innerText));
    const ops = lcsOps(aKeys, bKeys);
    const out = [];

    for (let i = 0; i < ops.length; i++) {
      const op = ops[i];
      const next = ops[i + 1];
      if (op.op === "eq") {
        out.push(cloneKeep(after[op.bi]));
      } else if (op.op === "del" && next && next.op === "ins") {
        const oldEl = before[op.ai];
        const newEl = after[next.bi];
        const oldT = oldEl?.innerText || op.text;
        const newT = newEl?.innerText || next.text;
        const tag = (newEl?.tagName || "P").toUpperCase();
        const rich =
          /^(H[1-6]|TABLE|UL|OL|DIV|FIGURE|DETAILS|SECTION)$/.test(tag) ||
          /figure-wrap|compare|tag-legend|mobile-explore/i.test(newEl?.className || "");
        // One copy only: the current (after) block, softly marked.
        // Short prose can get sentence-level tint; tables/media = whole-block green wash.
        if (rich || newT.length > 400) {
          out.push(wrapBlock(newEl, "ins", newEl.innerHTML));
        } else {
          out.push(wrapBlock(newEl, "changed", sentenceDiffHtml(oldT, newT)));
        }
        i++;
      } else if (op.op === "del") {
        // Removed with no replacement — show once, compact
        const el = before[op.ai];
        out.push(wrapBlock(el, "del", el.innerHTML));
      } else if (op.op === "ins") {
        const el = after[op.bi];
        out.push(wrapBlock(el, "ins", el.innerHTML));
      }
    }
    return out.join("\n");
  };

  /** Last resort if only plain hunks (should be rare). */
  const proseFromHunks = (hunks) => {
    const parts = [];
    let dels = [];
    let inss = [];
    const flush = () => {
      if (!dels.length && !inss.length) return;
      const oldT = dels.join(" ").trim();
      const newT = inss.join(" ").trim();
      if (oldT && newT) {
        parts.push(`<p class="hist-block hist-block-changed">${sentenceDiffHtml(oldT, newT)}</p>`);
      } else if (oldT) {
        parts.push(`<p class="hist-block hist-block-del">${esc(oldT)}</p>`);
      } else if (newT) {
        parts.push(`<p class="hist-block hist-block-ins">${esc(newT)}</p>`);
      }
      dels = [];
      inss = [];
    };
    (hunks || []).forEach((h) => {
      if (h.op === "eq") {
        flush();
      } else if (h.op === "del") {
        dels.push(h.text);
      } else if (h.op === "ins") {
        inss.push(h.text);
      }
    });
    flush();
    return parts.join("\n");
  };

  const renderTrackProse = (track) => {
    if (track?.beforeHtml && track?.snapshotHtml) {
      return proseDiffHtml(track.beforeHtml, track.snapshotHtml);
    }
    if (track?.snapshotHtml && !track?.beforeHtml) return track.snapshotHtml;
    if (track?.hunks?.length) return proseFromHunks(track.hunks);
    return track?.snapshotHtml || "";
  };

  const diffIncremental = (oldText, newText) => {
    const a = String(oldText || "").replace(/\r\n/g, "\n").split("\n");
    const b = String(newText || "").replace(/\r\n/g, "\n").split("\n");
    const ops = lcsOps(a, b);
    const hunks = [];
    const stats = { delete: 0, insert: 0 };
    ops.forEach((o) => {
      if (o.op === "del") {
        stats.delete++;
        hunks.push({ op: "del", text: o.text });
      } else if (o.op === "ins") {
        stats.insert++;
        hunks.push({ op: "ins", text: o.text });
      }
    });
    return { hunks, stats, empty: stats.delete === 0 && stats.insert === 0 };
  };

  const uid = () => {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${Math.random().toString(36).slice(2, 7)}`;
  };

  const articlePlain = (articleEl) => {
    if (!articleEl) return "";
    return articleEl.innerText.replace(/\u00a0/g, " ").replace(/\r\n/g, "\n").trimEnd() + "\n";
  };

  const probeApi = async () => {
    try {
      const r = await fetch(`${API_BASE}/api/ping`, { method: "GET" });
      return r.ok;
    } catch {
      return false;
    }
  };

  const pushApi = async (payload) => {
    const r = await fetch(`${API_BASE}/api/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  };

  const listTracks = async () => {
    const local = await idbGetAll();
    local.sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
    return local;
  };

  const createTrack = async ({ label, oldText, newText, snapshotHtml, beforeHtml, source }) => {
    const { hunks, stats, empty } = diffIncremental(oldText, newText);
    if (empty) return { ok: false, reason: "no-change" };
    const prev = await idbMetaGet("headId");
    const track = {
      id: uid(),
      createdAt: new Date().toISOString(),
      label: (label || "Correction").trim(),
      parentId: prev || null,
      source: source || "browser",
      stats,
      hunks,
      beforeHtml: beforeHtml || null,
      snapshotHtml: snapshotHtml || null,
    };
    await idbPut(track);
    await idbMetaSet("headId", track.id);
    await idbMetaSet("headPlain", newText);
    await idbMetaSet("headHtml", snapshotHtml || null);
    if (snapshotHtml) {
      try {
        localStorage.setItem("villa-caroline-head-html-v3", snapshotHtml);
      } catch (_) {
        /* quota / private mode */
      }
    }
    let api = null;
    if (await probeApi()) {
      try {
        api = await pushApi({ track, plain: newText, html: snapshotHtml, beforeHtml });
      } catch (e) {
        api = { ok: false, error: String(e.message || e) };
      }
    }
    return { ok: true, track, api };
  };

  const ensureSeed = async (seedTrack) => {
    if (!seedTrack?.id) return;
    const all = await idbGetAll();
    const existing = all.find((t) => t.id === seedTrack.id);
    if (existing) {
      // Force-upgrade seed HTML when rebuild improved snapshots
      if (
        seedTrack.snapshotHtml &&
        (!existing.snapshotHtml ||
          !existing.beforeHtml ||
          (seedTrack.beforeHtml && existing.beforeHtml !== seedTrack.beforeHtml))
      ) {
        await idbPut({ ...existing, ...seedTrack });
      }
      return;
    }
    await idbPut(seedTrack);
    const head = await idbMetaGet("headId");
    if (!head) {
      await idbMetaSet("headId", seedTrack.id);
      if (seedTrack.headPlain) await idbMetaSet("headPlain", seedTrack.headPlain);
    }
  };

  window.VillaHistory = {
    articlePlain,
    diffIncremental,
    proseDiffHtml,
    proseFromHunks,
    renderTrackProse,
    listTracks,
    createTrack,
    ensureSeed,
    idbMetaGet,
    idbMetaSet,
    probeApi,
    API_BASE,
  };
})();
</script>
<script>/* Histoire: monography-like prose with red/green text; quiet track picker */
(() => {
  const H = window.VillaHistory;
  if (!H) return;

  const picker = document.getElementById("hist-picker");
  const article = document.getElementById("hist-article");
  if (!picker || !article) return;

  let seed = null;
  try {
    const el = document.getElementById("hist-seed");
    seed = el ? JSON.parse(el.textContent) : null;
  } catch {
    seed = null;
  }

  const fmt = (iso) => {
    try {
      return new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
    } catch {
      return iso || "";
    }
  };

  const showTrack = (track) => {
    if (!track) {
      article.innerHTML = "";
      return;
    }
    article.innerHTML = H.renderTrackProse(track);
    picker.value = track.id;
    history.replaceState(null, "", `#${encodeURIComponent(track.id)}`);
  };

  const mergeDiskTracks = async (local) => {
    if (!(await H.probeApi())) return local;
    try {
      const r = await fetch(`${H.API_BASE}/api/tracks`);
      if (!r.ok) return local;
      const data = await r.json();
      const byId = new Map();
      [...(data.tracks || []), ...local].forEach((t) => {
        if (t?.id) byId.set(t.id, t);
      });
      for (const t of byId.values()) await H.ensureSeed(t);
      return [...byId.values()].sort((a, b) =>
        (a.createdAt || "").localeCompare(b.createdAt || "")
      );
    } catch {
      return local;
    }
  };

  const render = async () => {
    if (seed) await H.ensureSeed(seed);
    let tracks = await H.listTracks();
    tracks = await mergeDiskTracks(tracks);

    picker.innerHTML = "";
    if (!tracks.length) {
      picker.hidden = true;
      article.innerHTML = "";
      return;
    }
    picker.hidden = false;
    tracks
      .slice()
      .reverse()
      .forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t.id;
        opt.textContent = `${t.label || t.id} · ${fmt(t.createdAt)}`;
        picker.appendChild(opt);
      });

    const hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    const pick = tracks.find((t) => t.id === hash) || tracks[tracks.length - 1];
    showTrack(pick);
  };

  picker.addEventListener("change", async () => {
    const tracks = await H.listTracks();
    const t = tracks.find((x) => x.id === picker.value);
    if (t) showTrack(t);
  });

  window.addEventListener("storage", (e) => {
    if (e.key === "villa-history-ping") render();
  });

  render();
})();
</script>
</body>
