ives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg) · [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c). Recensement 1891 (*vues consultées*) : Salis non repéré ; **René d’Argenson** à la Place de la Halle **[F]** - [REC 1891](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) · [extrait](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg). Pas de titre de propriété établi pour la villa.\r\n\r\n**Les noms de lieux.** « Les Ormes » = commune **ou** lieu-dit à Naintré **[F]** - [vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37).\r\n\r\n**Le style.** Le PLU écrit « art déco » **[F]** - [GPU](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0). Morphologie et fenêtre catalogue Deglane (~1890) disent plutôt Belle Époque **[H]**. On suit le second pour un projet ; le libellé PLU reste discutable **[H]**.\r\n\r\n**Boulanger / Audy.** Boulanger trop fragile pour le récit factuel **[S]** - [Wiki rév. 226575693](https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&oldid=226575693). Audy : mariage **Ludger × Coutard**, 16 avril 1898, aux Ormes **[F]** - [TD](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg) ; Fabrice au n°13 **[F]** (annuaire agrégateur, pas titre) - [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) ; acquisition de la villa encore **[S]/[ÀV]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/).\r\n\r\n---\r\n\r\n## 7. Ce qu’il reste à vérifier **[ÀV]**\r\n\r\nPour transformer les plus belles hypothèses en faits, il faudrait notamment :\r\n\r\n1. **Les registres du cadastre** (matrices) pour la parcelle AB 143 - [portail AD86](https://archives-deux-sevres-vienne.fr/) ; repère parcelle : [cadastre AB 143](https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394).\r\n2. **L’acte complet** de la vente de 1890 chez le notaire (pas seulement le résumé du registre) - point de départ : [vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37).\r\n3. **Le dossier d’inventaire après décès** de Salis, feuillets complets - [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9). Silence de notice ≠ « hors succession ».\r\n4. **Les études des notaires** de la commune des Ormes - [AD86](https://archives-deux-sevres-vienne.fr/).\r\n5. **Plans Deglane pour la villa** - la cote AN **AJ/52/361** citée par [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf) est un **dossier d’élève** (lettres, notes), **pas** un fonds de plans de la villa **[F]** (2026-11-17). Chercher ailleurs (permis, autres fonds).\r\n6. **L’état civil** de la Marie-Louise du début du XXᵉ siècle - avant toute affirmation de nom de famille. *(TD Ormes 1883-1902 : pas de Salis ; pas de Boulanger - [TD 1883-92](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c).)*\r\n7. **L’acte d’acquisition** de la famille Audy (titre / matrices) - pour sortir de l’estimation « depuis 70 ans » ([OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/)). *Déjà [F] : Fabrice Audy au n°13 ([annuaire agrégateur](https://gepatroj.com/a/adresse-et-telephone-audy-1.php)) ; mariage **Audy Ludger Eugène × Coutard Camille Angèle**, 16 avril 1898, aux Ormes ([TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg)) - présence Audy locale dès 1898, **sans** preuve que ce soit l’achat de la villa.*\r\n8. **Recensements 1901 / 1906** - Audy / Salis / adresse rue Pierre-d’Argenson (REC 1891 : Salis non repéré sur les *vues consultées* - [REC](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) ; TD 1893-1902 : Audy 1898, pas de Salis).\r\n9. **État civil Naintré** - acte de décès Salis 20/03/1897 (commune déjà [F] notices) + TD Naintré 1893-1902 si disponible - [AD86](https://archives-deux-sevres-vienne.fr/).\r\n\r\n---\r\n\r\n## 8. Conclusion\r\n\r\nLa Villa Caroline est adressée, cadastrée (366 m² PCI), photographiée, située dans le régime des abords du château **[F]** - [cadastre](https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394), [IGN](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19), [PLU](https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0). Nom Marie-Louise sur *cette* rue : carte postale du début du XXᵉ siècle **[F]** - [Geneanet](https://en.geneanet.org/postcards/view/7781445) ; identité n°13 / AB 143 : **[H]**. Notice AGORHA : villa aux Ormes par Deglane en 1890 **[F]** - [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf) ; identification avec le n°13 **[H]/[ÀV]**. Salis documenté dans la région **[F]** ; propriétaire de *cette* maison : tradition locale seulement **[S]/[H]** - [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/). Acte 1890 solide le concernant ici : vigne à Naintré **[F]** - [registre AD86](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37). État civil Ormes **1883-1902** : **pas de Salis** **[F]** - [TD 1883-92](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) ; mariage **Audy × Coutard** 16 avril 1898 **[F]** - [TD](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg). Fabrice Audy au n°13 aujourd’hui **[F]** (annuaire agrégateur) - [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) ; acquisition de *cette* maison ~1950 encore **[S]/[ÀV]**. Inventaire 1897 : silence de *notice* seulement ; corps non lu = encore **[H]/[ÀV]**.\r\n\r\nPour un projet : orientation Belle Époque / fin XIXᵉ **[H]** ; abords MH (avis ABF) **[F]** ; centre-bourg probable **[H]/[ÀV]** ; tradition Chat Noir / Deglane / Marie-Louise **[S]** (pas un titre) ; monogramme, vitraux et plafond à documenter sans datation d’autorité **[H]/[S]** ; volume ancien vs ajouts (piscine **[F]** ; Audy local dès 1898 **[F]** + domicile contemporain **[F]** ; titre villa Audy **[S]/[ÀV]**).\r\n\r\nProchaines pièces utiles : matrices cadastrales, minute notariale de 1890, folios de l’inventaire 1897, REC 1901/1906, acte de mariage Audy 1898, acte d’acquisition villa.\r\n\r\n---\r\n\r\n## Annexe - Chronologie en un coup d’œil\r\n\r\n| Quand | Quoi | Tag | Lien |\r\n|------|------|-----|------|\r\n| Vers 1890 | Notice : Deglane a « une villa aux Ormes » | **[F]** notice · ID maison = **[H]/[ÀV]** | [AGORHA](https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf) |\r\n| 7 nov. 1890 | Salis achète une vigne « les Ormes », cne Naintré | **[F]** - pas la villa | [AD86 vue 37](https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37) |\r\n| 1er avril 1891 | Naissance **Salsier** Louis | **[F]** | [TD](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1883-92_Salsier_Louis_naissance.jpg) |\r\n| 1891 | REC (*vues lues*) : René d’Argenson, Place de la Halle ; Salis non repéré | **[F]** | [REC](https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d) · [extrait](../08_Iconographie/Archives_AD86_EC/REC_1891_Rene_dArgenson_Place_Halle.jpg) |\r\n| 1883-1892 | TD Ormes : **aucun Salis** (N/M/D) | **[F]** | [TD](https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b) |\r\n| 16 avril 1898 | Mariage **Audy** Ludger × **Coutard** Camille (Ormes) | **[F]** | [TD 1893-1902](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) · [extrait](../08_Iconographie/Archives_AD86_EC/TD_1893-1902_mariages_Audy_Ludger.jpg) |\r\n| 1893-1902 | TD Ormes : **aucun Salis** ; pas de Boulanger | **[F]** | [TD](https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c) |\r\n| Tradition locale | Salis commanditaire pour Marie-Louise | **[S]/[H]** | [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/) |\r\n| 17 août 1892 | Salis acquiert la Tour de Naintré | **[F]** | [Folio inventaire / latour](https://latourdenaintre.fr/wp-content/uploads/2026/09/FRAN_0159_22721_L-medium.jpg) · [notice FA](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9) |\r\n| 20 mars 1897 | Mort de Salis ; inventaire | **[F]** · silence *notice* Ormes ; corps non lu = **[H]/[ÀV]** | [FranceArchives](https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9) |\r\n| Vers 1903 | CP Villa Marie-Louise (nom sur *cette* rue) | **[F]** · ID n°13 = **[H]** | [Geneanet](https://en.geneanet.org/postcards/view/7781445) |\r\n| Vers 1950 ? | Famille Audy ; nom Caroline | **[S]/[ÀV]** | [OT](https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/) |\r\n| Début années 2000 | Piscine visible | **[F]** | [IGN](https://remonterletemps.ign.fr/comparer/?lon=0.603394&lat=46.975082&z=19) |\r\n| Contemporain | Fabrice Audy @ 13 rue P.-d’Argenson (annuaire agrégateur) | **[F]** | [annuaire](https://gepatroj.com/a/adresse-et-telephone-audy-1.php) |\r\n| 2025 | Wiki « Boulanger » (rév. anonyme) | **[S]** | [oldid 226575693](https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&oldid=226575693) |\r\n\r\n---\r\n\r\n## Annexe - Petit glossaire\r\n\r\n*AGORHA* : base biographique d’architectes (INHA). *Matrices* : registres du cadastre qui suivent les propriétaires dans le temps. *Répertoire / minute* : le répertoire est l’index du notaire ; la minute est l’acte complet. *Inventaire après décès* : liste des biens dressée après une mort, pour la succession. *Abords MH* : périmètre de 500 m autour d’un monument historique (régime des abords) ; travaux sensibles soumis à l’avis de l’ABF. *PCI* : plan cadastral informatisé (surface figurative, pas arpentage géomètre). *[F]* : donnée d’annuaire / base contemporaine — pas un acte de propriété.\r\n\r\n---\r\n\r\n*Texte destiné à un lecteur particulier. Tags **[F] / [S] / [H] / [ÀV]** + lien (et image) après chaque source. Ne remplace pas un acte notarié, un permis, ni une consultation en archives.*\r\n", "snapshotHtml": "<div class=\"mobile-explore\" aria-label=\"Explorer\">\n  <span class=\"rail-label\">Fils narratifs<\/span>\n  <div class=\"chip-row\"><button type=\"button\" class=\"chip\" data-xref-chip=\"deglane\">Deglane<\/button>\n<button type=\"button\" class=\"chip\" data-xref-chip=\"salis\">Salis<\/button>\n<button type=\"button\" class=\"chip\" data-xref-chip=\"marie-louise\">Marie-Louise<\/button>\n<button type=\"button\" class=\"chip\" data-xref-chip=\"audy\">Audy<\/button>\n<button type=\"button\" class=\"chip\" data-xref-chip=\"naintre\">Naintré<\/button>\n<button type=\"button\" class=\"chip\" data-xref-chip=\"parcelle\">AB 143<\/button><\/div>\n  <span class=\"rail-label\">Filtrer par preuve<\/span>\n  <div class=\"chip-row\"><button type=\"button\" class=\"chip\" data-filter=\"f\">[F]<\/button>\n<button type=\"button\" class=\"chip\" data-filter=\"s\">[S]<\/button>\n<button type=\"button\" class=\"chip\" data-filter=\"h\">[H]<\/button>\n<button type=\"button\" class=\"chip\" data-filter=\"av\">[ÀV]<\/button><\/div>\n<\/div>\n<div class=\"tag-legend\"><p><strong>Comment lire les niveaux de confiance<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Sens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td>Fait établi (document officiel, archive, photo datée contrôlée)<\/td>\n<\/tr>\n<tr>\n<td><span class=\"tag tag-s\">[S]<\/span><\/td>\n<td>Source secondaire (presse, blog, office de tourisme, tradition rapportée)<\/td>\n<\/tr>\n<tr>\n<td><span class=\"tag tag-h\">[H]<\/span><\/td>\n<td>Hypothèse plausible, pas encore prouvée<\/td>\n<\/tr>\n<tr>\n<td><span class=\"tag tag-av\">[ÀV]<\/span><\/td>\n<td>À vérifier — cité ailleurs, pas encore contrôlé sur pièce<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Après chaque source : <strong>lien cliquable<\/strong>, citation courte, et <strong>image<\/strong> quand elle existe.<\/p><\/div>\n<hr>\n<h2 id=\"en-quelques-mots\">En quelques mots<\/h2>\n<h3 id=\"a-établi-sur-pièces\">A — Établi sur pièces<\/h3>\n<p>La Villa Caroline porte l’adresse <strong>13 rue Pierre-d’Argenson<\/strong>, parcelle cadastrale <strong><button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button><\/strong> (réf. nationale 86183000AB0143) <span class=\"tag tag-f\">[F]<\/span>. Surface affichée au plan cadastral informatisé (PCI) : <strong>366 m²<\/strong> — figure cadastrale, <strong>non<\/strong> arpentage géomètre <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">Cadastre — AB 143<\/a><\/p>\n<p>Vers 1903, une carte postale de <em>cette<\/em> rue légende « la Villa <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> à droite » <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet — carte postale #7781445<\/a><\/p>\n<p>Volume principal déjà là sur les orthophotos <strong>1950–1965<\/strong> ; piscine absente alors, visible au plus tard <strong>2000–2005<\/strong> <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN — Remonter le temps<\/a><\/p>\n<p>Maison <strong>non<\/strong> classée monument historique <span class=\"tag tag-f\">[F]<\/span>. Elle entre dans le <strong>régime des abords<\/strong> du château (périmètre de 500 m) : travaux sensibles soumis à l’<strong>avis de l’architecte des Bâtiments de France (ABF)<\/strong> <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">PLU / abords — GPU<\/a><br>\n→ <a href=\"https://www.pop.culture.gouv.fr/notice/merimee/PA00105572\">POP — château / Mérimée PA00105572<\/a><\/p>\n<p>Notice AGORHA : <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> a « une villa aux Ormes (Vienne) en 1890 » <span class=\"tag tag-f\">[F]<\/span> (notice biographique seulement).<\/p>\n<p class=\"source-line\">→ <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA — notice Deglane<\/a><\/p>\n<p>Le 7 novembre 1890, <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> achète une vigne lieu-dit « les Ormes », commune de <strong><button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button><\/strong> — <strong>1 ha 48 a 4 ca<\/strong>, 3 300 F — <strong>pas<\/strong> la villa <span class=\"tag tag-f\">[F]<\/span>. Tour de <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> en 1892 ; mort à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> en 1897 <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">AD86 — répertoire Lasserré, vue 37<\/a><br>\n→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives — inventaire / succession Salis<\/a><\/p>\n<p>Tables décennales Ormes <strong>1883–1902<\/strong> : <strong>aucun <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> indexé (N/M/D) <span class=\"tag tag-f\">[F]<\/span> ; naissance <strong>Salsier<\/strong> Louis, 1891 (<strong>≠<\/strong> <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button>) <span class=\"tag tag-f\">[F]<\/span>. Sur le recensement 1891 (<em>vues consultées<\/em> : Place de la Halle, Grande Rue) : <strong><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> non repéré<\/strong> <span class=\"tag tag-f\">[F]<\/span> (négatif limité aux vues lues).<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD Ormes 1883–1892<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893–1902<\/a><br>\n→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC 1891<\/a><\/p>\n<p>Mariage <strong><button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> Ludger × Coutard<\/strong>, 16 avril 1898, aux Ormes <span class=\"tag tag-f\">[F]<\/span>. Annuaire agrégateur contemporain : <strong>Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button><\/strong> au n°13 <span class=\"tag tag-f\">[F]<\/span> — adresse d’annuaire, <strong>pas<\/strong> un titre de propriété.<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD mariages 1893–1902<\/a><br>\n→ <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">Annuaire agrégateur — Audy Fabrice<\/a><\/p>\n<p>La cote AN <strong>AJ/52/361<\/strong> citée par AGORHA est un <strong>dossier d’élève<\/strong> (lettres, notes), <strong>pas<\/strong> un fonds de plans de la villa <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA — notice Deglane<\/a><\/p>\n<h3 id=\"b-tradition-et-questions-ouvertes\">B — Tradition et questions ouvertes<\/h3>\n<p>Que la carte postale « <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> » montre <em>exactement<\/em> le bâtiment du n°13 / <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> reste <span class=\"tag tag-h\">[H]<\/span> tant que calage façade / matrice manquent.<\/p>\n<p>Identification <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> = n°13 / <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> : <span class=\"tag tag-h\">[H]/[ÀV]<\/span>.<\/p>\n<p>Tradition locale (office de tourisme, presse, blog — <strong>un<\/strong> courant) : <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Henri Deglane<\/button> architecte en 1890, <button type=\"button\" class=\"xref\" data-xref=\"salis\">Rodolphe Salis<\/button> commanditaire pour une <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button>, famille <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> vers le milieu du XXᵉ et renommage Caroline en hommage à Caroline Waldé <span class=\"tag tag-s\">[S]<\/span>. Acquisition de <em>cette<\/em> maison ≈1950 et lien Waldé : <span class=\"tag tag-s\">[S]/[ÀV]<\/span> seulement — pas une date d’acte.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT Grand Châtellerault, 2020<\/a><\/p>\n<p><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> maître d’ouvrage de <em>cette<\/em> maison : <span class=\"tag tag-s\">[S]/[H]<\/span>. Patronyme <strong>Boulanger<\/strong> pour <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> : rév. Wikipédia anonyme 2025, sans source <span class=\"tag tag-s\">[S]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&amp;oldid=226575693\">Wiki — rév. 17/06/2025<\/a><\/p>\n<p>Style observé : Belle Époque / fin XIXᵉ <span class=\"tag tag-h\">[H]<\/span> ; le PLU écrit « art déco » <span class=\"tag tag-f\">[F]<\/span>. Zone UA (centre-bourg) : <span class=\"tag tag-h\">[H]/[ÀV]<\/span>. Vitrail / plafond « d’origine 1890 » : <span class=\"tag tag-h\">[H]<\/span> (état récent photographié seulement). Notice inventaire 1897 : silence sur la commune des Ormes <span class=\"tag tag-f\">[F]<\/span> ; corps du dossier <strong>non lu<\/strong> → présence éventuelle de la villa encore <span class=\"tag tag-h\">[H]/[ÀV]<\/span> (pas « hors succession »).<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">PLU — GPU<\/a><br>\n→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives — notice inventaire<\/a><\/p>\n<p>Pièces encore utiles : matrices <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button>, minute 1890, inventaire 1897 complet, REC 1901/1906, acte d’acquisition <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button>.<\/p>\n<hr>\n<h2 id=\"1-la-question-que-lon-se-pose\">1. La question que l’on se pose<\/h2>\n<p>Qui a fait bâtir la maison du 13 rue Pierre-d’Argenson ? Pour qui ? Et sous quel titre de propriété ?<\/p>\n<p>La tradition locale répond : <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> architecte, <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> commanditaire, <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> dédicataire, famille <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> au XXᵉ siècle <span class=\"tag tag-s\">[S]<\/span>.<\/p>\n<p>Le 7 novembre 1890, <button type=\"button\" class=\"xref\" data-xref=\"salis\">Rodolphe Salis<\/button> achète une pièce de terre en vigne au lieu-dit « les Ormes », dans la <strong>commune de <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button><\/strong>. Ce n’est <strong>pas<\/strong> la commune des Ormes. Ce n’est <strong>pas<\/strong> la villa <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">Archives Deux-Sèvres-Vienne - répertoire Lasserré, vue 37<\/a><\/p>\n<hr>\n<h2 id=\"2-la-maison-et-son-quartier\">2. La maison et son quartier<\/h2>\n<h3 id=\"face-au-domaine-dargenson\">Face au domaine d’Argenson<\/h3>\n<p>Les Ormes ont une longue histoire seigneuriale : domaine attesté dès la fin du XIVᵉ siècle, passage aux Argenson en 1729, grandes écuries du XVIIIᵉ, reconstruction du logis au tournant du XXᵉ <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://pop.culture.gouv.fr/notice/merimee/IA86000547\">POP - notice château / domaine IA86000547<\/a><\/p>\n<p>La villa s’installe dans ce paysage de bourg recomposé, côté est du parc, sur une lanière entre la rue et le jardin. L’office de tourisme relie la maison au château voisin, notamment via le vitrail rabelaisien de la salle à manger <span class=\"tag tag-s\">[S]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT Grand Châtellerault, 8 sept. 2020<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Vitrail à sujet rabelaisien\" src=\"assets/2026-11-13_OT_vitraux_rabelais_fc381dfe.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Vitrail de la salle à manger (reportage OT 2020) <span class=\"tag tag-s\">[S]<\/span>. Source : <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">tourisme-chatellerault.fr<\/a>. État récent ; origine 1890 non prouvée <span class=\"tag tag-h\">[H]<\/span>.<\/em><\/p>\n<h3 id=\"la-parcelle\">La parcelle<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Adresse<\/td>\n<td>13 rue Pierre-d’Argenson, 86220 Les Ormes<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<\/tr>\n<tr>\n<td>Parcelle<\/td>\n<td><button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> (référence nationale 86183000AB0143)<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<\/tr>\n<tr>\n<td>Surface<\/td>\n<td>366 m² (PCI — figure cadastrale, non arpentée géomètre)<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<\/tr>\n<tr>\n<td>Emplacement<\/td>\n<td>environ 46,975° N / 0,603° E<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"source-line\">→ <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">Carte cadastrale interactive - AB 143<\/a><\/p>\n<p>La parcelle voisine au sud (AB 144, 144 m²) prolonge le jardin : quand on imagine « la villa et son jardin », on ne regarde pas seulement les 366 m² <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<div class=\"figure-wrap\"><img alt=\"Parcelle AB 143 sur le cadastre actuel\" src=\"assets/capture_AB0143_selectionnee_85250418.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Parcelle <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> <span class=\"tag tag-f\">[F]<\/span>. Source : <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">cadastre.data.gouv.fr<\/a>. Fixe l’adresse et l’emprise actuelle - pas le propriétaire historique ni la date de construction.<\/em><\/p>\n<h3 id=\"ce-que-disent-les-règles-durbanisme\">Ce que disent les règles d’urbanisme<\/h3>\n<p>Le plan local d’urbanisme (approuvé en 2018) range la maison parmi le patrimoine bâti <strong>non classé<\/strong> monument historique, avec la mention « villa de style art déco » <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">Document PLU - Géoportail de l’urbanisme<\/a><br>\n→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/api/document/567b5bf6a339134f0bc34c21786068d0/files/86183_rapport_20180910.pdf\">Rapport de présentation (PDF)<\/a><\/p>\n<p>Mention présente dans le document officiel. Style observé : villégiature Belle Époque / fin XIXᵉ plutôt qu’Art déco des années 1920 <span class=\"tag tag-h\">[H]<\/span> - hypothèse de travail, pas datation prouvée.<\/p>\n<p>La rue relève <strong>très probablement<\/strong> du centre-bourg (zone dite « UA »), où l’aspect architectural compte <span class=\"tag tag-h\">[H]/[ÀV]<\/span> - à confirmer sur le <a href=\"https://www.geoportail-urbanisme.gouv.fr/map/?documentId=567b5bf6a339134f0bc34c21786068d0#tile=1&amp;lon=0.603394&amp;lat=46.975082&amp;zoom=18\">règlement graphique GPU<\/a>. La maison se trouve aussi dans le <strong>périmètre de 500 mètres<\/strong> autour des monuments protégés du château : elle relève du <strong>régime des abords<\/strong> ; les travaux susceptibles d’affecter l’aspect extérieur sont soumis à l’<strong>avis de l’architecte des Bâtiments de France (ABF)<\/strong> <span class=\"tag tag-f\">[F]<\/span>. Elle n’est en revanche <strong>pas<\/strong> elle-même sur la liste du classement du domaine <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://www.pop.culture.gouv.fr/notice/merimee/PA00105572\">base POP / Mérimée PA00105572<\/a> (contexte château).<\/p>\n<h3 id=\"ce-que-montrent-les-photos-aériennes\">Ce que montrent les photos aériennes<\/h3>\n<p>Dès les années 1950-1965, le volume principal est déjà là <span class=\"tag tag-f\">[F]<\/span>. Il n’y a pas encore de piscine <span class=\"tag tag-f\">[F]<\/span>. Entre 2000 et 2005, une piscine rectangulaire apparaît dans le jardin ; elle reste ensuite <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN - Remonter le temps (comparer)<\/a><\/p>\n<div class=\"compare\" role=\"img\" aria-label=\"Comparaison aérienne 1950 et 2000\"><img src=\"assets/2000-2005_8b35297e.jpg\" alt=\"Vue aérienne 2000-2005\"><img class=\"compare-top\" src=\"assets/1950-1960_58d6da82.jpg\" alt=\"Vue aérienne 1950-1960\"><div class=\"compare-handle\" aria-hidden=\"true\"><\/div><span class=\"compare-label before\">1950-60<\/span><span class=\"compare-label after\">2000-05<\/span><\/div><p class=\"compare-caption\">Glisser pour comparer : orthophoto 1950-1960 (sans piscine) et 2000-2005 (avec piscine).<\/p>\n<p>Volume principal conservé dans ses grandes lignes depuis le milieu du XXᵉ <span class=\"tag tag-f\">[F]<\/span> ; piscine = ajout, visible au début du XXIᵉ <span class=\"tag tag-f\">[F]<\/span>. Attribution du creusement à la famille <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> : tradition locale <span class=\"tag tag-s\">[S]<\/span> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a>.<\/p>\n<hr>\n<h2 id=\"3-les-personnes-du-récit\">3. Les personnes du récit<\/h2>\n<h3 id=\"henri-deglane-1855-1931-larchitecte\">Henri Deglane (1855-1931), l’architecte<\/h3>\n<p>Prix de Rome, puis l’un des architectes du Grand Palais à Paris. Dans la notice de référence qui lui est consacrée (base AGORHA, Institut national d’histoire de l’art), on lit qu’il a réalisé des constructions particulières, « <strong>dont une villa aux Ormes (Vienne) en 1890<\/strong> » <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<blockquote>\n<p>« …constructions particulières dont une villa aux Ormes (Vienne) en 1890… »<\/p>\n<\/blockquote>\n<p class=\"source-line\">→ <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA - notice Deglane (ark INHA)<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Portrait d’Henri Deglane\" src=\"assets/wiki_Henri_Deglane_portrait_500_266a3a0e.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em><button type=\"button\" class=\"xref\" data-xref=\"deglane\">Henri Deglane<\/button> (portrait ≤1905) <span class=\"tag tag-f\">[F]<\/span> illustratif. Source : <a href=\"https://commons.wikimedia.org/wiki/File:Henri_Deglane.jpg\">Wikimedia Commons<\/a> (fichier local du dossier). Identité de l’architecte ; pas le lien avec <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button>.<\/em><\/p>\n<p><button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> a donc une villa aux Ormes, en 1890, dans son catalogue <span class=\"tag tag-f\">[F]<\/span>. Que ce soit le numéro 13 de la rue Pierre-d’Argenson n’est pas établi : la <a href=\"https://en.geneanet.org/postcards/view/7781445\">carte postale Marie-Louise<\/a> sur cette rue nourrit l’hypothèse, sans plan, permis ni matrice pour la sceller <span class=\"tag tag-h\">[H]/[ÀV]<\/span>.<\/p>\n<p>La tradition locale attribue la maison à <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> à cette adresse <span class=\"tag tag-s\">[S]<\/span> :<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">Office de tourisme, 2020<\/a><br>\n→ <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise, févr. 2021<\/a><\/p>\n<p>OT, blog et presse reprennent en pratique <strong>un même courant<\/strong> narratif, pas trois preuves indépendantes.<\/p>\n<h3 id=\"rodolphe-salis-1851-1897-et-le-chat-noir\">Rodolphe Salis (1851-1897) et le Chat Noir<\/h3>\n<p>Fondateur du Chat Noir à Paris, époux de Marie Gabrielle Thiennet, acquéreur de la Tour de <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> en 1892 <span class=\"tag tag-f\">[F]<\/span>, mort à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> en 1897 <span class=\"tag tag-f\">[F]<\/span>. Origine « châtelleraudaise » parfois rapportée : <span class=\"tag tag-s\">[S]<\/span> (acte de naissance non cité ici).<\/p>\n<p class=\"source-line\">→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives - inventaire après décès / notice succession<\/a><\/p>\n<p>Autour des Ormes, on raconte qu’il aurait fait bâtir la villa pour une « <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> » <span class=\"tag tag-s\">[S]<\/span>. L’office de tourisme, un reportage France 3 et un blog anglais reprennent cette version. En pratique, c’est <strong>un même courant de tradition locale<\/strong>, pas trois sources indépendantes.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a><br>\n→ <a href=\"https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html\">France 3 - Itinéraire bis aux Ormes<\/a><br>\n→ <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise<\/a><\/p>\n<p>Aucun acte consulté jusqu’ici ne montre <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> propriétaire de la parcelle de la villa. L’acte de 1890 que l’on tient vraiment - et que l’on peut lire - concerne une vigne à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">vue 37 du registre<\/a>. <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> est donc un personnage <strong>documenté<\/strong> dans la région <span class=\"tag tag-f\">[F]<\/span> ; son rôle de maître d’ouvrage de <em>cette<\/em> maison reste, pour l’instant, une tradition <span class=\"tag tag-s\">[S]/[H]<\/span>.<\/p>\n<p>Dans les <em>tables décennales<\/em> des Ormes pour 1883-1892, le nom <strong><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> n’est indexé ni aux naissances, ni aux mariages, ni aux décès <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">Tables décennales Les Ormes 1883-1892 (AD86)<\/a><\/p>\n<p>Sous la lettre S des naissances figure <strong>Salsier Louis<\/strong>, 1er avril 1891 <span class=\"tag tag-f\">[F]<\/span> :<\/p>\n<div class=\"figure-wrap\"><img alt=\"Table décennale - Salsier Louis, 1er avril 1891\" src=\"assets/TD_1883-92_Salsier_Louis_naissance_3245b4b7.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Extrait de la table décennale des naissances, lettre S <span class=\"tag tag-f\">[F]<\/span>. Source : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">AD86, tables 1883-1892<\/a>. Prouve un <strong>Salsier<\/strong> aux Ormes en 1891. Ne prouve pas un <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> habitant ou propriétaire de la villa.<\/em><\/p>\n<p>Sur le recensement de 1891, <em>vues consultées<\/em> (Place de la Halle, Grande Rue) : <strong><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> non repéré<\/strong> <span class=\"tag tag-f\">[F]<\/span> — <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">recensement 1891<\/a>. À la Place de la Halle : <strong>René d’Argenson<\/strong>, propriétaire, avec deux enfants et du personnel <span class=\"tag tag-f\">[F]<\/span> :<\/p>\n<div class=\"figure-wrap\"><img alt=\"Recensement 1891 - René d’Argenson, Place de la Halle\" src=\"assets/REC_1891_Rene_dArgenson_Place_Halle_15f542e0.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Liste nominative 1891, « La Halle » <span class=\"tag tag-f\">[F]<\/span>. Source : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">AD86, recensement Les Ormes 1891<\/a>. Prouve René d’Argenson à la Halle. Ne prouve pas un dépouillement exhaustif de tout le bourg ; <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> non vu sur <em>ces<\/em> vues.<\/em><\/p>\n<div class=\"figure-wrap\"><img alt=\"Portrait de Rodolphe Salis\" src=\"assets/wiki_Portrait_de_Rodolphe_Salis_500_105f60c6.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em><button type=\"button\" class=\"xref\" data-xref=\"salis\">Rodolphe Salis<\/button> <span class=\"tag tag-f\">[F]<\/span> illustratif. Source : <a href=\"https://commons.wikimedia.org/wiki/File:Portrait_de_Rodolphe_Salis.jpg\">Wikimedia Commons<\/a> (<a href=\"https://upload.wikimedia.org/wikipedia/commons/0/05/Portrait_de_Rodolphe_Salis.jpg\">fichier<\/a>). Identité connue ; propriété de la villa <span class=\"tag tag-s\">[S]/[H]<\/span> ; TD Ormes 1883-92 sans <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> <span class=\"tag tag-f\">[F]<\/span>.<\/em><\/p>\n<h3 id=\"marie-louise-un-prénom-de-maison-pas-un-état-civil\">Marie-Louise - un prénom de maison, pas un état civil<\/h3>\n<p>Vers 1903, une carte postale de la rue Pierre-d’Argenson montre « la Villa <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> à droite » <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet - carte postale #7781445<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Même carte postale (rappel)\" src=\"assets/Geneanet_7781445_Villa_Marie-Louise_1903_01908b46.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Villa <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> à droite <span class=\"tag tag-f\">[F]<\/span>. Source : <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet #7781445<\/a>. Prouve le <em>nom<\/em> sur <em>cette<\/em> rue. Ne prouve pas le calage <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> / n°13 <span class=\"tag tag-h\">[H]<\/span>.<\/em><\/p>\n<p>Le prénom (ou le nom de maison) est donc ancien et bien attaché à <em>cette<\/em> rue — pas, à lui seul, une preuve que le bâtiment photographié = <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> / n°13 <span class=\"tag tag-h\">[H]<\/span>. En revanche, le nom de famille <strong>Boulanger<\/strong>, parfois ajouté sur Internet, ne repose pour l’instant que sur une modification Wikipédia du <strong>17 juin 2025<\/strong>, anonyme et sans source <span class=\"tag tag-s\">[S]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&amp;oldid=226575693\">Wikipédia — Les Ormes (Vienne), rév. 226575693<\/a><\/p>\n<p>Un reportage télé parle d’une « maîtresse » sans donner ce nom <span class=\"tag tag-s\">[S]<\/span> - <a href=\"https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html\">France 3<\/a>. On garde le prénom ; on laisse le patronyme de côté jusqu’à une preuve d’état civil <span class=\"tag tag-av\">[ÀV]<\/span>.<\/p>\n<h3 id=\"la-famille-audy-et-le-nom-caroline\">La famille Audy et le nom Caroline<\/h3>\n<p>Selon l’office de tourisme (2020), Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> présente une maison « dans sa famille depuis 70 ans », rebaptisée Villa Caroline en hommage à sa mère, Caroline Waldé <span class=\"tag tag-s\">[S]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT - « Les Ormes, la surprise du chef »<\/a><\/p>\n<p>Si l’on fait le calcul, on arrive vers 1950 - mais c’est une estimation à partir d’un témoignage, pas une date lue sur un acte <span class=\"tag tag-s\">[S]/[ÀV]<\/span>. Un <strong>annuaire agrégateur<\/strong> contemporain place bien <strong>Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button><\/strong> au <strong>13 rue Pierre-d’Argenson<\/strong>, 86220 Les Ormes <span class=\"tag tag-f\">[F]<\/span> — adresse d’annuaire, <strong>pas<\/strong> un titre de propriété ni une date d’acquisition.<\/p>\n<p class=\"source-line\">→ <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">Annuaire agrégateur - Audy Fabrice, Les Ormes<\/a><\/p>\n<p>D’autres archives (liées au peintre Tang Haywen) croisent les noms <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> / Caroline / Fabrice et parlent d’une « Villa Caroline », avec une géographie un peu floue (« Loire ») <span class=\"tag tag-h\">[H]/[ÀV]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.tanghaywenarchives.com/fr/friends/raymond-audy\">Tang Haywen Archives - Raymond Audy<\/a><\/p>\n<p>Noms convergents pour le XXᵉ siècle ; date d’acquisition et chaîne cadastrale <span class=\"tag tag-av\">[ÀV]<\/span>.<\/p>\n<p>Sur le recensement 1891 (<em>vues consultées<\/em>) : <strong><button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> non repéré<\/strong> <span class=\"tag tag-f\">[F]<\/span> — <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC 1891<\/a>. La table décennale <strong>1893-1902<\/strong> enregistre un mariage <strong><button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button><\/strong> aux Ormes le <strong>16 avril 1898<\/strong> :<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">Tables décennales Les Ormes 1893-1902 (AD86)<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"TD mariages - Audy × Coutard, 16 avril 1898\" src=\"assets/TD_1893-1902_mariages_Audy_Ludger_27e12e11.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Ligne de la table décennale des mariages <span class=\"tag tag-f\">[F]<\/span> : « <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> Ludger Eugène et Coutard Camille Angèle - 16 Avril 98 ». Source : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">AD86, TD 1893-1902<\/a>. Prouve une présence <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> aux Ormes dès 1898. Ne prouve pas l’achat de la villa ni le lien avec Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button>.<\/em><\/p>\n<p>Même décennie, lettre S (naissances / mariages / décès) : <strong>aucun <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">même ark<\/a> · <a href=\"assets/TD_1893-1902_naissances_S_a123ccde.jpg\">extrait<\/a>.<\/p>\n<h3 id=\"le-notaire-lasserré\">Le notaire Lasserré<\/h3>\n<p>Georges Victor Lasserré, notaire à Châtellerault, est le fil rouge documentaire de l’époque <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> : c’est chez lui que l’on trouve l’achat de la vigne de 1890 <span class=\"tag tag-f\">[F]<\/span>, et c’est lui qui apparaît dans les papiers de succession à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df\">Répertoire Lasserré en ligne (AD86)<\/a><br>\n→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">Notice inventaire Salis - FranceArchives<\/a><\/p>\n<p>Une partie de ses registres se lit en ligne ; les actes complets (les « minutes ») se consultent sur place aux Archives départementales <span class=\"tag tag-av\">[ÀV]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/\">portail Archives Deux-Sèvres-Vienne<\/a>.<\/p>\n<hr>\n<h2 id=\"4-ce-que-les-archives-disent-vraiment\">4. Ce que les archives disent vraiment<\/h2>\n<h3 id=\"lachat-du-7-novembre-1890-vigne-à-naintré\">L’achat du 7 novembre 1890 - vigne à Naintré<\/h3>\n<p>Dans le registre du notaire Lasserré, à la date du 7 novembre 1890, on lit une vente à <strong><button type=\"button\" class=\"xref\" data-xref=\"salis\">Rodolphe Salis<\/button><\/strong>, « directeur du Chat Noir » à Paris : une <strong>pièce de terre en vigne<\/strong>, lieu-dit <strong>les Ormes<\/strong>, commune de <strong><button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button><\/strong>, pour <strong>3 300 francs<\/strong> <span class=\"tag tag-f\">[F]<\/span>. Contenance : <strong>1 ha 48 a 4 ca<\/strong> — sans rapport avec les 366 m² de la villa <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">Image du registre - vue 37<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Extrait du registre notarial, vente de 1890\" src=\"assets/4E46_485_n676_crop_af2d5d8c.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Vente d’une vigne à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> <span class=\"tag tag-f\">[F]<\/span>. Source en ligne : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">AD86, vue 37<\/a>. Prouve l’achat de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> en 1890 - <strong>pas<\/strong> la propriété de la villa des Ormes.<\/em><\/p>\n<p>Un inventaire dressé après la mort de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> confirme les mêmes détails : même lieu-dit, même commune, même surface, même prix <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives - dossier d’inventaire<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Même vente, rappelée dans l’inventaire après décès\" src=\"assets/FRAN_0159_22721_lieudit_prix_a0582ffe.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Lieu-dit « les Ormes », commune de <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button>, 1 ha 48 a 4 ca, 3 300 F <span class=\"tag tag-f\">[F]<\/span>. Extrait local du dossier ; notice : <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a>. Toujours la vigne, jamais la villa.<\/em><\/p>\n<p><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> est donc actif dans la région en 1890, chez le même notaire <span class=\"tag tag-f\">[F]<\/span>. <strong>Cet acte ne titre pas la maison de la rue Pierre-d’Argenson<\/strong> <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<h3 id=\"la-tour-de-naintré-1892-et-linventaire-de-1897\">La Tour de Naintré (1892) et l’inventaire de 1897<\/h3>\n<p>En août 1892, <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> devient adjudicataire de la Tour de <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> - cela, les documents le confirment <span class=\"tag tag-f\">[F]<\/span>. À sa mort en 1897, un inventaire après décès est dressé à Paris <span class=\"tag tag-f\">[F]<\/span>. La <strong>notice<\/strong> qui décrit ce dossier ne mentionne pas la commune des Ormes <span class=\"tag tag-f\">[F]<\/span> — silence de <em>notice<\/em>, pas conclusion sur le contenu des feuillets.<\/p>\n<p class=\"source-line\">→ <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">Notice FranceArchives<\/a><br>\n→ Contexte Tour : <a href=\"https://latourdenaintre.fr/le-chateau/rodolphe-salis/\">latourdenaintre.fr - Rodolphe Salis<\/a><\/p>\n<p>Le dossier complet (une douzaine de feuillets) n’a pas encore été lu en entier : on ne sait pas si la villa y figure <span class=\"tag tag-h\">[H]/[ÀV]<\/span>. Ce silence de notice <strong>ne<\/strong> permet <strong>pas<\/strong> de dire que la villa est « hors succession ».<\/p>\n<h3 id=\"des-silences-qui-comptent\">Des silences qui comptent<\/h3>\n<p>Des publications savantes ou locales sur <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> et <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> ne parlent pas de la villa des Ormes <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"http://academie-de-touraine.com/Tome_22_files/138_243-275.pdf\">Académie de Touraine - Oberthür (PDF)<\/a><br>\n→ <a href=\"https://latourdenaintre.fr/le-chateau/rodolphe-salis/\">latourdenaintre.fr - Salis<\/a><br>\n→ Bilan recherches presse / Gallica : fichier local du dossier <code>09_Sources_Archives/Gallica_BnF/BILAN_RECHERCHE.md<\/code> (pas une page d’accueil Gallica).<\/p>\n<p>Absence constatée dans <em>ces<\/em> textes et dans le bilan local seulement <span class=\"tag tag-f\">[F]<\/span> — pas une preuve d’inexistence de la villa ni d’absence de titre <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button>.<\/p>\n<h3 id=\"la-carte-postale-vers-1903\">La carte postale vers 1903<\/h3>\n<p>Déjà citée plus haut ; on la rappelle ici comme preuve du <em>nom<\/em> <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> sur <em>cette<\/em> rue <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet #7781445<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Carte postale Villa Marie-Louise\" src=\"assets/Geneanet_7781445_Villa_Marie-Louise_1903_01908b46.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Villa <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> à droite, légende catalogue « vue prise vers 1903 » <span class=\"tag tag-f\">[F]<\/span>. Source : <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet #7781445<\/a>. Prouve le <em>nom<\/em> sur <em>cette<\/em> rue. Ne prouve pas <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button>, ni <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> propriétaire, ni Boulanger, ni le calage <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> / n°13 <span class=\"tag tag-h\">[H]<\/span>.<\/em><\/p>\n<hr>\n<h2 id=\"5-ce-que-lon-voit-de-la-maison\">5. Ce que l’on voit de la maison<\/h2>\n<h3 id=\"le-style\">Le style<\/h3>\n<p>Toiture débordante, bois apparent, baies hautes, jeux de brique et de pierre, frises, ferronnerie, vitraux à médaillons : le vocabulaire est celui d’une <strong>villégiature éclectique de la fin du XIXᵉ siècle<\/strong>, pas celui de l’Art déco géométrique des années 1920 <span class=\"tag tag-h\">[H]<\/span>. Pour un projet de restauration, on retient donc plutôt « Belle Époque / vers 1890 » comme orientation - en sachant que c’est une lecture raisonnée de l’apparence, pas une date lue sur un permis. Le PLU, lui, dit « art déco » <span class=\"tag tag-f\">[F]<\/span>.<\/p>\n<p class=\"source-line\">→ <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">PLU Les Ormes<\/a><\/p>\n<h3 id=\"façade-et-détails-photos-récentes\">Façade et détails (photos récentes)<\/h3>\n<p class=\"source-line\">→ <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise - Villa Caroline (2021)<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Façade sur rue, 2021\" src=\"assets/2021_DaysOnTheClaise_facade_rue_ffec2b3a.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Façade vue de la rue en 2021 <span class=\"tag tag-s\">[S]<\/span>. Source : <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">daysontheclaise.blogspot.com<\/a>. Aspect contemporain ; pas une preuve de l’état de 1890.<\/em><\/p>\n<div class=\"figure-wrap\"><img alt=\"Monogramme au sol\" src=\"assets/2026-11-13_blog_monogramme_LR_hires_de043808.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Monogramme en carrelage <span class=\"tag tag-s\">[S]<\/span> (lecture du blog). Source : <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">même article<\/a>. Présence du motif claire sur photo récente ; déchiffrement et date d’origine <span class=\"tag tag-h\">[H]<\/span>.<\/em><\/p>\n<div class=\"figure-wrap\"><img alt=\"Portail\" src=\"assets/2026-11-13_blog_portail_hires_af629f8f.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Portail et ferronnerie, état récent <span class=\"tag tag-s\">[S]<\/span>. Source : <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">Days on the Claise<\/a>. Aspect contemporain ; pas une datation 1890.<\/em><\/p>\n<h3 id=\"intérieurs-reportage-2020\">Intérieurs (reportage 2020)<\/h3>\n<p class=\"source-line\">→ <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT Grand Châtellerault, 2020<\/a><\/p>\n<div class=\"figure-wrap\"><img alt=\"Vitrail Rabelais\" src=\"assets/2026-11-13_OT_vitraux_rabelais_fc381dfe.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Vitrail rabelaisien <span class=\"tag tag-s\">[S]<\/span>. Source : <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a>. Sujet clair aujourd’hui ; authenticité d’origine ouverte <span class=\"tag tag-h\">[H]/[S]<\/span>.<\/em><\/p>\n<div class=\"figure-wrap\"><img alt=\"Plafond peint\" src=\"assets/2026-11-13_OT_plafond_allegorie_89230e9d.jpg\"><span class=\"zoom-hint\">Agrandir<\/span><\/div>\n<p><em>Plafond allégorique <span class=\"tag tag-s\">[S]<\/span>. Source : <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT 2020<\/a>. État récent ; pas d’attribution ni de date <span class=\"tag tag-h\">[H]<\/span>.<\/em><\/p>\n<hr>\n<h2 id=\"6-où-les-versions-se-contredisent-ou-semblent-se-contredire\">6. Où les versions se contredisent - ou semblent se contredire<\/h2>\n<p><strong>L’architecte.<\/strong> Trois éléments distincts, de poids inégal : (1) notice AGORHA — <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button>, une villa aux Ormes, 1890 <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a> ; (2) tradition locale — c’est <em>celle-ci<\/em> <span class=\"tag tag-s\">[S]<\/span> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a> / <a href=\"https://daysontheclaise.blogspot.com/2021/02/villa-caroline.html\">blog<\/a> ; (3) carte postale — sur <em>cette<\/em> rue, le nom <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> existe déjà vers 1903 <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet<\/a>. Ce n’est <strong>pas<\/strong> une triple corroboration indépendante que <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> a bâti le n°13 : le premier est un fait de catalogue ; le deuxième un courant narratif unique ; le troisième un nom de maison sur la rue. L’identification avec le n°13 / <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> reste <span class=\"tag tag-h\">[H]/[ÀV]<\/span>.<\/p>\n<p><strong>Le propriétaire.<\/strong> Tradition : <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> <span class=\"tag tag-s\">[S]/[H]<\/span> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>, <a href=\"https://france3-regions.franceinfo.fr/nouvelle-aquitaine/vienne/itineraire-bis-aux-ormes-vienne-1428261.html\">France 3<\/a>. Acte 1890 : vigne à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">registre AD86<\/a>. Notice d’inventaire 1897 : pas de commune Les Ormes <span class=\"tag tag-f\">[F]<\/span> (corps non lu = encore <span class=\"tag tag-h\">[H]/[ÀV]<\/span>) - <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a>. Tables décennales Ormes <strong>1883-1892<\/strong> et <strong>1893-1902<\/strong> : <strong>aucun <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> ; naissance <strong>Salsier Louis<\/strong>, 1er avril 1891 <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD 1883-92<\/a> · <a href=\"assets/TD_1883-92_Salsier_Louis_naissance_3245b4b7.jpg\">extrait<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a>. Recensement 1891 (<em>vues consultées<\/em>) : <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> non repéré ; <strong>René d’Argenson<\/strong> à la Place de la Halle <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC 1891<\/a> · <a href=\"assets/REC_1891_Rene_dArgenson_Place_Halle_15f542e0.jpg\">extrait<\/a>. Pas de titre de propriété établi pour la villa.<\/p>\n<p><strong>Les noms de lieux.<\/strong> « Les Ormes » = commune <strong>ou<\/strong> lieu-dit à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">vue 37<\/a>.<\/p>\n<p><strong>Le style.<\/strong> Le PLU écrit « art déco » <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">GPU<\/a>. Morphologie et fenêtre catalogue <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> (~1890) disent plutôt Belle Époque <span class=\"tag tag-h\">[H]<\/span>. On suit le second pour un projet ; le libellé PLU reste discutable <span class=\"tag tag-h\">[H]<\/span>.<\/p>\n<p><strong>Boulanger / <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button>.<\/strong> Boulanger trop fragile pour le récit factuel <span class=\"tag tag-s\">[S]<\/span> - <a href=\"https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&amp;oldid=226575693\">Wiki rév. 226575693<\/a>. <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> : mariage <strong>Ludger × Coutard<\/strong>, 16 avril 1898, aux Ormes <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD<\/a> · <a href=\"assets/TD_1893-1902_mariages_Audy_Ludger_27e12e11.jpg\">extrait<\/a> ; Fabrice au n°13 <span class=\"tag tag-f\">[F]<\/span> (annuaire agrégateur, pas titre) - <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a> ; acquisition de la villa encore <span class=\"tag tag-s\">[S]/[ÀV]<\/span> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>.<\/p>\n<hr>\n<h2 id=\"7-ce-quil-reste-à-vérifier-àv\">7. Ce qu’il reste à vérifier <span class=\"tag tag-av\">[ÀV]<\/span><\/h2>\n<p>Pour transformer les plus belles hypothèses en faits, il faudrait notamment :<\/p>\n<ol>\n<li><strong>Les registres du cadastre<\/strong> (matrices) pour la <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">parcelle AB<\/button> 143 - <a href=\"https://archives-deux-sevres-vienne.fr/\">portail AD86<\/a> ; repère parcelle : <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">cadastre AB 143<\/a>.<\/li>\n<li><strong>L’acte complet<\/strong> de la vente de 1890 chez le notaire (pas seulement le résumé du registre) - point de départ : <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">vue 37<\/a>.<\/li>\n<li><strong>Le dossier d’inventaire après décès<\/strong> de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button>, feuillets complets - <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a>. Silence de notice ≠ « hors succession ».<\/li>\n<li><strong>Les études des notaires<\/strong> de la commune des Ormes - <a href=\"https://archives-deux-sevres-vienne.fr/\">AD86<\/a>.<\/li>\n<li><strong>Plans <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> pour la villa<\/strong> - la cote AN <strong>AJ/52/361<\/strong> citée par <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a> est un <strong>dossier d’élève<\/strong> (lettres, notes), <strong>pas<\/strong> un fonds de plans de la villa <span class=\"tag tag-f\">[F]<\/span> (2026-11-17). Chercher ailleurs (permis, autres fonds).<\/li>\n<li><strong>L’état civil<\/strong> de la <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> du début du XXᵉ siècle - avant toute affirmation de nom de famille. <em>(TD Ormes 1883-1902 : pas de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> ; pas de Boulanger - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD 1883-92<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a>.)<\/em><\/li>\n<li><strong>L’acte d’acquisition<\/strong> de la famille <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> (titre / matrices) - pour sortir de l’estimation « depuis 70 ans » (<a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>). <em>Déjà <span class=\"tag tag-f\">[F]<\/span> : Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> au n°13 (<a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire agrégateur<\/a>) ; mariage <strong><button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> Ludger Eugène × Coutard Camille Angèle<\/strong>, 16 avril 1898, aux Ormes (<a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a> · <a href=\"assets/TD_1893-1902_mariages_Audy_Ludger_27e12e11.jpg\">extrait<\/a>) - présence <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> locale dès 1898, <strong>sans<\/strong> preuve que ce soit l’achat de la villa.<\/em><\/li>\n<li><strong>Recensements 1901 / 1906<\/strong> - <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> / <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> / adresse rue Pierre-d’Argenson (REC 1891 : <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> non repéré sur les <em>vues consultées<\/em> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC<\/a> ; TD 1893-1902 : <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> 1898, pas de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button>).<\/li>\n<li><strong>État civil <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button><\/strong> - acte de décès <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> 20/03/1897 (commune déjà <span class=\"tag tag-f\">[F]<\/span> notices) + TD <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> 1893-1902 si disponible - <a href=\"https://archives-deux-sevres-vienne.fr/\">AD86<\/a>.<\/li>\n<\/ol>\n<hr>\n<h2 id=\"8-conclusion\">8. Conclusion<\/h2>\n<p>La Villa Caroline est adressée, cadastrée (366 m² PCI), photographiée, située dans le régime des abords du château <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://cadastre.data.gouv.fr/map?parcel=86183000AB0143#18/46.975082/0.603394\">cadastre<\/a>, <a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN<\/a>, <a href=\"https://www.geoportail-urbanisme.gouv.fr/document/by-id/567b5bf6a339134f0bc34c21786068d0\">PLU<\/a>. Nom <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> sur <em>cette<\/em> rue : carte postale du début du XXᵉ siècle <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet<\/a> ; identité n°13 / <button type=\"button\" class=\"xref\" data-xref=\"parcelle\">AB 143<\/button> : <span class=\"tag tag-h\">[H]<\/span>. Notice AGORHA : villa aux Ormes par <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> en 1890 <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a> ; identification avec le n°13 <span class=\"tag tag-h\">[H]/[ÀV]<\/span>. <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> documenté dans la région <span class=\"tag tag-f\">[F]<\/span> ; propriétaire de <em>cette<\/em> maison : tradition locale seulement <span class=\"tag tag-s\">[S]/[H]<\/span> - <a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a>. Acte 1890 solide le concernant ici : vigne à <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button> <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">registre AD86<\/a>. État civil Ormes <strong>1883-1902<\/strong> : <strong>pas de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD 1883-92<\/a> · <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a> ; mariage <strong><button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> × Coutard<\/strong> 16 avril 1898 <span class=\"tag tag-f\">[F]<\/span> - <a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD<\/a> · <a href=\"assets/TD_1893-1902_mariages_Audy_Ludger_27e12e11.jpg\">extrait<\/a>. Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> au n°13 aujourd’hui <span class=\"tag tag-f\">[F]<\/span> (annuaire agrégateur) - <a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a> ; acquisition de <em>cette<\/em> maison ~1950 encore <span class=\"tag tag-s\">[S]/[ÀV]<\/span>. Inventaire 1897 : silence de <em>notice<\/em> seulement ; corps non lu = encore <span class=\"tag tag-h\">[H]/[ÀV]<\/span>.<\/p>\n<p>Pour un projet : orientation Belle Époque / fin XIXᵉ <span class=\"tag tag-h\">[H]<\/span> ; abords MH (avis ABF) <span class=\"tag tag-f\">[F]<\/span> ; centre-bourg probable <span class=\"tag tag-h\">[H]/[ÀV]<\/span> ; tradition Chat Noir / <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> / <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> <span class=\"tag tag-s\">[S]<\/span> (pas un titre) ; monogramme, vitraux et plafond à documenter sans datation d’autorité <span class=\"tag tag-h\">[H]/[S]<\/span> ; volume ancien vs ajouts (piscine <span class=\"tag tag-f\">[F]<\/span> ; <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> local dès 1898 <span class=\"tag tag-f\">[F]<\/span> + domicile contemporain <span class=\"tag tag-f\">[F]<\/span> ; titre villa <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> <span class=\"tag tag-s\">[S]/[ÀV]<\/span>).<\/p>\n<p>Prochaines pièces utiles : matrices cadastrales, minute notariale de 1890, folios de l’inventaire 1897, REC 1901/1906, acte de mariage <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> 1898, acte d’acquisition villa.<\/p>\n<hr>\n<h2 id=\"annexe-chronologie-en-un-coup-dœil\">Annexe - Chronologie en un coup d’œil<\/h2>\n<table>\n<thead>\n<tr>\n<th>Quand<\/th>\n<th>Quoi<\/th>\n<th>Tag<\/th>\n<th>Lien<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Vers 1890<\/td>\n<td>Notice : <button type=\"button\" class=\"xref\" data-xref=\"deglane\">Deglane<\/button> a « une villa aux Ormes »<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span> notice · ID maison = <span class=\"tag tag-h\">[H]/[ÀV]<\/span><\/td>\n<td><a href=\"https://agorha.inha.fr/ark:/54721/0cc32af3-1b5d-4c63-8d69-244e6863cdaf\">AGORHA<\/a><\/td>\n<\/tr>\n<tr>\n<td>7 nov. 1890<\/td>\n<td><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> achète une vigne « les Ormes », cne <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button><\/td>\n<td><span class=\"tag tag-f\">[F]<\/span> - pas la villa<\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta39b1102e998b87df/daogrp/0/37\">AD86 vue 37<\/a><\/td>\n<\/tr>\n<tr>\n<td>1er avril 1891<\/td>\n<td>Naissance <strong>Salsier<\/strong> Louis<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD<\/a> · <a href=\"assets/TD_1883-92_Salsier_Louis_naissance_3245b4b7.jpg\">extrait<\/a><\/td>\n<\/tr>\n<tr>\n<td>1891<\/td>\n<td>REC (<em>vues lues<\/em>) : René d’Argenson, Place de la Halle ; <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> non repéré<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vta16b47523a5bb815d\">REC<\/a> · <a href=\"assets/REC_1891_Rene_dArgenson_Place_Halle_15f542e0.jpg\">extrait<\/a><\/td>\n<\/tr>\n<tr>\n<td>1883-1892<\/td>\n<td>TD Ormes : <strong>aucun <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> (N/M/D)<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtaf212deb2cbb96a4b\">TD<\/a><\/td>\n<\/tr>\n<tr>\n<td>16 avril 1898<\/td>\n<td>Mariage <strong><button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button><\/strong> Ludger × <strong>Coutard<\/strong> Camille (Ormes)<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD 1893-1902<\/a> · <a href=\"assets/TD_1893-1902_mariages_Audy_Ludger_27e12e11.jpg\">extrait<\/a><\/td>\n<\/tr>\n<tr>\n<td>1893-1902<\/td>\n<td>TD Ormes : <strong>aucun <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button><\/strong> ; pas de Boulanger<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://archives-deux-sevres-vienne.fr/ark:/28387/vtae58beb875beb936c\">TD<\/a><\/td>\n<\/tr>\n<tr>\n<td>Tradition locale<\/td>\n<td><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> commanditaire pour <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button><\/td>\n<td><span class=\"tag tag-s\">[S]/[H]<\/span><\/td>\n<td><a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a><\/td>\n<\/tr>\n<tr>\n<td>17 août 1892<\/td>\n<td><button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> acquiert la Tour de <button type=\"button\" class=\"xref\" data-xref=\"naintre\">Naintré<\/button><\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://latourdenaintre.fr/wp-content/uploads/2026/09/FRAN_0159_22721_L-medium.jpg\">Folio inventaire / latour<\/a> · <a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">notice FA<\/a><\/td>\n<\/tr>\n<tr>\n<td>20 mars 1897<\/td>\n<td>Mort de <button type=\"button\" class=\"xref\" data-xref=\"salis\">Salis<\/button> ; inventaire<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span> · silence <em>notice<\/em> Ormes ; corps non lu = <span class=\"tag tag-h\">[H]/[ÀV]<\/span><\/td>\n<td><a href=\"https://francearchives.gouv.fr/fr/facomponent/5c6be812e8374f0f70ae78d3b5c3288fb48117a9\">FranceArchives<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vers 1903<\/td>\n<td>CP Villa <button type=\"button\" class=\"xref\" data-xref=\"marie-louise\">Marie-Louise<\/button> (nom sur <em>cette<\/em> rue)<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span> · ID n°13 = <span class=\"tag tag-h\">[H]<\/span><\/td>\n<td><a href=\"https://en.geneanet.org/postcards/view/7781445\">Geneanet<\/a><\/td>\n<\/tr>\n<tr>\n<td>Vers 1950 ?<\/td>\n<td>Famille <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> ; nom Caroline<\/td>\n<td><span class=\"tag tag-s\">[S]/[ÀV]<\/span><\/td>\n<td><a href=\"https://www.tourisme-chatellerault.fr/2020/09/08/les-ormes-la-surprise-du-chef-1-2/\">OT<\/a><\/td>\n<\/tr>\n<tr>\n<td>Début années 2000<\/td>\n<td>Piscine visible<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://remonterletemps.ign.fr/comparer/?lon=0.603394&amp;lat=46.975082&amp;z=19\">IGN<\/a><\/td>\n<\/tr>\n<tr>\n<td>Contemporain<\/td>\n<td>Fabrice <button type=\"button\" class=\"xref\" data-xref=\"audy\">Audy<\/button> @ 13 rue P.-d’Argenson (annuaire agrégateur)<\/td>\n<td><span class=\"tag tag-f\">[F]<\/span><\/td>\n<td><a href=\"https://gepatroj.com/a/adresse-et-telephone-audy-1.php\">annuaire<\/a><\/td>\n<\/tr>\n<tr>\n<td>2025<\/td>\n<td>Wiki « Boulanger » (rév. anonyme)<\/td>\n<td><span class=\"tag tag-s\">[S]<\/span><\/td>\n<td><a href=\"https://fr.wikipedia.org/w/index.php?title=Les_Ormes_(Vienne)&amp;oldid=226575693\">oldid 226575693<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr>\n<h2 id=\"annexe-petit-glossaire\">Annexe - Petit glossaire<\/h2>\n<p><em>AGORHA<\/em> : base biographique d’architectes (INHA). <em>Matrices<\/em> : registres du cadastre qui suivent les propriétaires dans le temps. <em>Répertoire / minute<\/em> : le répertoire est l’index du notaire ; la minute est l’acte complet. <em>Inventaire après décès<\/em> : liste des biens dressée après une mort, pour la succession. <em>Abords MH<\/em> : périmètre de 500 m autour d’un monument historique (régime des abords) ; travaux sensibles soumis à l’avis de l’ABF. <em>PCI<\/em> : plan cadastral informatisé (surface figurative, pas arpentage géomètre). <em><span class=\"tag tag-f\">[F]<\/span><\/em> : donnée d’annuaire / base contemporaine — pas un acte de propriété.<\/p>\n<hr>\n<p><em>Texte destiné à un lecteur particulier. Tags <strong><span class=\"tag tag-f\">[F]<\/span> / <span class=\"tag tag-s\">[S]<\/span> / <span class=\"tag tag-h\">[H]<\/span> / <span class=\"tag tag-av\">[ÀV]<\/span><\/strong> + lien (et image) après chaque source. Ne remplace pas un acte notarié, un permis, ni une consultation en archives.<\/em><\/p>", "beforeHtml": "<h1>Villa Caroline<\/h1>\n<p><strong>13 rue Pierre-d’Argenson, 86220 Les Ormes<\/strong><br />\n<em>(autrefois Villa Marie-Louise)<\/em><\/p>\n<p><em>Dossier de recherche, novembre 2026.<\/em><\/p>\n<hr />\n<h2>En quelques mots<\/h2>\n<p>Face au château des Ormes, sur une lanière de jardin entre la rue et le parc, se dresse une maison de villégiature que l’on appelle aujourd’hui Villa Caroline. Elle occupe la parcelle AB 143 - trois cent soixante-six mètres carrés - au 13 de la rue Pierre-d’Argenson. Au début du XXᵉ siècle, la même maison s’appelait déjà Villa Marie-Louise : une carte postale de la rue le montre clairement. Le volume principal est là sur les vues aériennes des années 1950 ; la piscine, elle, n’apparaît qu’au début des années 2000. La maison n’est pas classée monument historique, mais elle se trouve dans le rayon de protection des abords du château : tout travaux sensibles y demandent un avis préalable.<\/p>\n<p>Autour de cette adresse circule un récit agréable et tenace. Henri Deglane, Prix de Rome et futur architecte du Grand Palais, aurait bâti la villa en 1890. Rodolphe Salis, le fondateur du Chat Noir à Paris, Châtelleraudais d’origine, l’aurait commandée pour une Marie-Louise. Plus tard, la famille Audy l’aurait acquise vers le milieu du XXᵉ siècle et rebaptisée Caroline, en hommage à Caroline Waldé, mère de l’actuel habitant. Office de tourisme, presse et blogs locaux reprennent en pratique le même courant : un récit unique, répété, plus qu’une chaîne de preuves indépendantes.<\/p>\n<p>Ce que l’on peut tenir pour solide se sépare assez nettement de ce récit. Deglane a bien, dans sa notice de référence, « une villa aux Ormes (Vienne) en 1890 » - le catalogue d’architecte est clair. Que ce soit précisément le numéro 13 de la rue Pierre-d’Argenson reste vraisemblable (la carte postale Marie-Louise sur <em>cette<\/em> rue va dans le même sens), mais aucun plan, permis ni matrice cadastrale ne l’a encore scellé. Salis, lui, est bien documenté dans la région : en novembre 1890, chez le notaire Lasserré à Châtellerault, il achète une pièce de terre en vigne au lieu-dit « les Ormes » - mais dans la <em>commune de Naintré<\/em>, pas aux Ormes, et pour une surface d’environ un hectare et demi, sans rapport avec les 366 m² de la villa. Deux ans plus tard, il acquiert la Tour de Naintré ; il y meurt en 1897. Aucun acte consulté jusqu’ici ne le montre propriétaire de la maison de la rue Pierre-d’Argenson. Dans l’état civil de la commune des Ormes, entre 1883 et 1902, le nom Salis n’apparaît ni aux naissances, ni aux mariages, ni aux décès ; le recensement du bourg en 1891 non plus. Sous la lettre S des naissances figure un Salsier Louis, en 1891 - orthographe distincte, autre personne. Le patronyme Boulanger parfois collé à Marie-Louise sur Internet repose sur une modification Wikipédia anonyme, sans source.<\/p>\n<p>Les Audy, en revanche, laissent une trace locale ancienne : le 16 avril 1898, Ludger Eugène Audy épouse Camille Angèle Coutard aux Ormes. Fabrice Audy habite bien le 13 rue Pierre-d’Argenson aujourd’hui. Entre ces deux pôles - présence Audy dès 1898, domicile contemporain - la date d’acquisition de <em>cette<\/em> maison et la chaîne de titres restent ouvertes. Quant au style, toitures débordantes, bois apparent, baies hautes et jeux de brique disent plutôt Belle Époque / fin XIXᵉ que l’« art déco » inscrit dans le PLU - une étiquette de document, pas une datation d’architecte.<\/p>\n<p>En résumé : la maison est bien là, nommée, photographiée, située face au domaine d’Argenson. Deglane a bien une villa aux Ormes en 1890 ; Salis a bien une vigne « les Ormes » à Naintré la même année. Le reste - identification exacte de la villa Deglane, propriété Salis, identité civile de Marie-Louise, titre Audy vers 1950 - demande encore les pièces qui manquent : matrices cadastrales, minute notariale, inventaire après décès feuillets complets, recensements 1901-1906, acte d’acquisition. Les chapitres qui suivent sourcent, image par image et lien par lien, chacune de ces phrases.<\/p>\n<hr />\n<p><strong>Comment lire les niveaux de confiance<\/strong> (dans le détail ci-dessous)<\/p>\n<table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Sens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>[F]<\/strong><\/td>\n<td>Fait établi (document officiel, archive, photo datée contrôlée)<\/td>\n<\/tr>\n<tr>\n<td><strong>[S]<\/strong><\/td>\n<td>Source secondaire (presse, blog, office de tourisme, tradition rapportée)<\/td>\n<\/tr>\n<tr>\n<td><strong>[H]<\/strong><\/td>\n<td>Hypothèse plausible, pas encore prouvée<\/td>\n<\/tr>\n<tr>\n<td><strong>[ÀV]<\/strong><\/td>\n<td>À vérifier - cité ailleurs, pas encore contrôlé sur pièce<\/td>\n<\/tr>\n<tr>\n<td><strong>[F] icono<\/strong><\/td>\n<td>Fait pour l’image / la légen
